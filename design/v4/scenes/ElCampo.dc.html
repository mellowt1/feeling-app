<!doctype html>

<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    a { color: #6b7749; } a:hover { color: #2c2c27; }
    .scene { --sky1:#CFDDEA; --sky2:#E4E9EC; --sky3:#F2EEE3; --range:#B4B6C4; --snow:#F4F2EE; --mid:#D9C78F; --front:#BFA765; --road:#A79A7A; --sil:#4A463C; --orb:#F4D8A0; --cloud:rgba(255,255,255,.75); --star:0; --sun:1; --moon:0; --glow:0; --warm:0; --milky:0; --lamp:0; }
    .scene.time-dawn { --sky1:#B8A7C4; --sky2:#E9C4A6; --sky3:#F4E3CE; --range:#A79AA9; --snow:#F6D6C4; --sun:0; --glow:1; --warm:.5; --cloud:rgba(250,225,205,.8); }
    .scene.time-dusk { --sky1:#A79BC0; --sky2:#EBBF9C; --sky3:#F4E3CE; --range:#9C93A8; --snow:#EFD3C3; --mid:#CDB57E; --front:#AD9556; --road:#9C8D6C; --sil:#3E3A38; --orb:#F3B98A; --sun:0; --warm:1; --glow:.6; --cloud:rgba(246,217,193,.7); }
    .scene.time-night { --sky1:#0E1220; --sky2:#18202F; --sky3:#2A2F38; --range:#343A4B; --snow:#5A6070; --mid:#3A3728; --front:#2A281D; --road:#3A362C; --sil:#9A9483; --orb:#E1E4E8; --cloud:rgba(255,255,255,.07); --star:1; --sun:0; --moon:1; --milky:1; --lamp:1; }
    .sky { position:absolute; inset:0; background: linear-gradient(var(--sky1) 0%, var(--sky2) 50%, var(--sky3) 78%); }
    .breathe { position:absolute; inset:0; background: radial-gradient(circle at 50% 45%, var(--sky1), transparent 70%); animation: breathe 14s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity:0 } to { opacity:.3 } }
    svg.layer { position:absolute; left:0; top:0; width:390px; height:844px; overflow:visible; }
    .sun { fill: var(--orb); opacity: var(--sun); filter: blur(10px); }
    .sunglow { fill: var(--orb); opacity: calc(var(--sun) * .35); filter: blur(28px); }
    .dusksun { fill: var(--orb); opacity: var(--warm); filter: blur(8px); }
    .moon { fill: var(--orb); opacity: var(--moon); }
    .moonglow { fill: #fff; opacity: calc(var(--moon) * .18); filter: blur(22px); }
    .milky { fill: #fff; opacity: calc(var(--milky) * .07); filter: blur(18px); }
    .star { fill: #fff; opacity: 0; animation: twinkle 6s ease-in-out infinite; }
    .time-night .star { animation-name: twinkleOn; }
    @keyframes twinkle { from { opacity:0 } to { opacity:0 } }
    @keyframes twinkleOn { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
    .cloud { fill: var(--cloud); filter: blur(4px); animation: cloudDrift linear infinite; }
    .cloud.c1 { animation-duration: 70s; } .cloud.c2 { animation-duration: 95s; animation-delay:-40s; }
    @keyframes cloudDrift { from { transform: translateX(420px) } to { transform: translateX(-300px) } }
    .lenticular { fill: var(--cloud); filter: blur(3px); animation: lenti 40s ease-in-out infinite alternate; }
    @keyframes lenti { from { transform: translateX(-6px) scaleX(1) } to { transform: translateX(6px) scaleX(1.06) } }
    .range { fill: var(--range); }
    .snow { fill: var(--snow); opacity:.9; }
    .alpenglow { fill: #F2A48A; opacity: 0; animation: glow 300s ease-in-out 1 forwards; }
    @keyframes glow { 0% { opacity: calc(var(--glow) * .55) } 40% { opacity: calc(var(--glow) * .5) } 100% { opacity: 0 } }
    .steppe.mid { fill: var(--mid); } .steppe.front { fill: var(--front); } .road { fill: var(--road); }
    .dash { fill: #fff; opacity:.5; }
    .sil { fill: var(--sil); opacity:.62; } .sil.far { opacity:.3; } .sil.mid { opacity:.48; }
    .stroke { fill:none; stroke: var(--sil); stroke-opacity:.62; stroke-linecap: round; }
    .tuft { fill:none; stroke: var(--sil); stroke-opacity:.5; stroke-width:1.2; stroke-linecap:round; transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }
    .tuft.t2 { animation-duration: 2.7s; animation-delay:-1.1s } .tuft.t3 { animation-duration: 3.6s; animation-delay:-2s } .tuft.t4 { animation-duration: 2.9s; animation-delay:-.6s }
    @keyframes sway { from { transform: skewX(-4deg) } to { transform: skewX(5deg) } }
    .gust { animation: gustAll 140s linear infinite; }
    @keyframes gustAll { 0%,90% { transform: skewX(0) } 92% { transform: skewX(6deg) } 96% { transform: skewX(6deg) } 100% { transform: skewX(0) } }
    .wind { fill:none; stroke: var(--sil); stroke-opacity:.14; stroke-width:1; animation: windStreak 140s linear infinite; }
    .wind.w2 { animation-delay: .4s } .wind.w3 { animation-delay: .9s }
    @keyframes windStreak { 0%,90% { opacity:0; transform: translateX(400px) scaleX(.4) } 91% { opacity:1 } 94% { opacity:0; transform: translateX(-200px) scaleX(1.4) } 100% { opacity:0 } }
    .molino { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .condor { animation: condor 110s linear infinite; }
    .condortilt { transform-box: fill-box; transform-origin: center; animation: tilt 4s ease-in-out infinite alternate; }
    @keyframes condor { 0% { transform: translate(60px,0) scale(1) } 25% { transform: translate(0,14px) scale(1.15) } 50% { transform: translate(-60px,0) scale(1) } 75% { transform: translate(0,-14px) scale(.8) } 100% { transform: translate(60px,0) scale(1) } }
    @keyframes tilt { from { transform: rotate(-6deg) } to { transform: rotate(6deg) } }
    .time-night .condor { display:none; }
    .neck { transform-box: fill-box; transform-origin: 20% 100%; animation: graze 24s ease-in-out infinite; }
    @keyframes graze { 0%,8% { transform: rotate(0) } 13% { transform: rotate(38deg) } 30% { transform: rotate(38deg) } 36% { transform: rotate(0) } 100% { transform: rotate(0) } }
    .guanaco { animation: walk 360s linear infinite; }
    @keyframes walk { 0%,40% { transform: translateX(0) } 46%,90% { transform: translateX(-36px) } 96%,100% { transform: translateX(0) } }
    .rhea { animation: rhea 240s linear infinite; }
    @keyframes rhea { 0% { transform: translateX(-60px) } 100% { transform: translateX(460px) } }
    .rhealeg { transform-box: fill-box; transform-origin: 50% 0; animation: step .9s ease-in-out infinite alternate; }
    .rhealeg.b { animation-delay: -.45s }
    @keyframes step { from { transform: rotate(-12deg) } to { transform: rotate(12deg) } }
    .hare { animation: hare 300s linear infinite; }
    @keyframes hare { 0%,70% { opacity:0; transform: translate(0,0) } 70.2% { opacity:.6 } 71% { transform: translate(-30px,-8px) } 72% { transform: translate(-60px,0) } 73% { transform: translate(-90px,-8px) } 74% { transform: translate(-120px,0); opacity:.6 } 74.2%,100% { opacity:0 } }
    .fox { animation: fox 420s linear infinite; }
    .time-day .fox, .time-dawn .fox { display:none; }
    @keyframes fox { 0%,50% { opacity:0; transform: translateX(0) } 50.5% { opacity:.55 } 60% { transform: translateX(-160px); opacity:.55 } 60.5%,100% { opacity:0 } }

    /* people: one silhouette, one opacity, small living motions */

    .figure { opacity:.8; }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath2 4.6s ease-in-out infinite alternate; }
    @keyframes breath2 { from { transform: scaleY(1) } to { transform: scaleY(1.018) } }
    .rodg { transform-box: fill-box; transform-origin: 100% 50%; animation: rodSway 6s ease-in-out infinite alternate; }
    .fore1 { transform-box: fill-box; transform-origin: 100% 100%; animation: sip 46s ease-in-out infinite; }
    @keyframes sip { 0%,84% { transform: rotate(0) } 87% { transform: rotate(35deg) } 93% { transform: rotate(35deg) } 96% { transform: rotate(0) } 100% { transform: rotate(0) } }
    .figure .fl { fill: var(--sil); }
    .figure .ln { fill:none; stroke: var(--sil); stroke-linecap: round; stroke-linejoin: round; }
    .figure .fb { fill: var(--sil); stroke: var(--sil); stroke-linecap: round; stroke-linejoin: round; }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath2 4.6s ease-in-out infinite alternate; }
    @keyframes breath2 { from { transform: scaleY(1) } to { transform: scaleY(1.025) } }
    .swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 5.2s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-3deg) } to { transform: rotate(3deg) } }
    .toe { transform-box: fill-box; transform-origin: 50% 100%; animation: toe 22s ease-in-out infinite; }
    @keyframes toe { 0%,88% { transform: rotate(0) } 91% { transform: rotate(-10deg) } 94% { transform: rotate(4deg) } 97%,100% { transform: rotate(0) } }
    .sip { transform-box: fill-box; transform-origin: 100% 92%; animation: sip 46s ease-in-out infinite; }
    @keyframes sip { 0%,84% { transform: rotate(0) } 87% { transform: rotate(40deg) } 93% { transform: rotate(40deg) } 96% { transform: rotate(0) } 100% { transform: rotate(0) } }
    .rodg { transform-box: fill-box; transform-origin: 100% 0%; animation: rodSway 6s ease-in-out infinite alternate; }

    .steam { fill:none; stroke:#fff; stroke-opacity:.5; stroke-width:.8; animation: steam 4s ease-in-out infinite; }
    @keyframes steam { 0% { opacity:0; transform: translateY(0) } 40% { opacity:.6 } 100% { opacity:0; transform: translateY(-8px) } }
    .truck { animation: truck 3600s linear infinite; animation-delay:-3560s; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes truck { 0% { transform: translate(0,0) scale(.15); opacity:0 } .05% { opacity:.6 } 1.1% { transform: translate(-60px,60px) scale(1.4); opacity:.6 } 1.15%,100% { transform: translate(-60px,60px) scale(1.4); opacity:0 } }
    .lamp { fill:#F2C98A; opacity: calc(var(--lamp) * .9); }
    .lampglow { fill:#F2C98A; opacity: calc(var(--lamp) * .2); filter: blur(10px); }
    .sheep { fill: var(--snow); opacity:.5; }
  </style>
</helmet>
