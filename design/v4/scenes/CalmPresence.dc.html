<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0b0f10;}
a{color:#5f8790;} a:hover{color:#7d9ea6;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;">
<div style="width:100%;max-width:1200px;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);">
<svg viewBox="0 0 1200 440" width="100%" style="display:block;">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe6e3"></stop><stop offset="1" stop-color="#f3f4f0"></stop></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9ea5"></stop><stop offset="1" stop-color="#5a7f89"></stop></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<mask id="reflMask"><rect x="0" y="290" width="1200" height="150" fill="url(#fade)"></rect></mask>
<filter id="soft"><feGaussianBlur stdDeviation="1.2"></feGaussianBlur></filter>
<!-- Figure 1: fishing, legs dangling -->
<g id="fig-fish" fill="#66777c" stroke="#66777c" stroke-linecap="round" stroke-linejoin="round">
  <path stroke="none" d="M128 66 C140 70,148 80,148 96 C148 112,150 128,150 140 L90 140 C88 156,84 174,84 188 C84 195,80 199,73 199 L58 202 C52 202,50 196,55 193 L68 190 C66 172,64 156,66 143 C67 128,72 118,84 116 L100 116 C105 112,104 100,108 88 C112 76,116 70,120 67 Z"></path>
  <path stroke="none" d="M118 69 L136 66 L131 54 L115 60 Z"></path>
  <ellipse cx="121" cy="50" rx="15" ry="17" transform="rotate(-8 121 50)" stroke="none"></ellipse>
  <path fill="none" stroke-width="11" d="M138 86 C132 98,124 108,116 113 C108 118,98 121,90 121"></path>
  <circle cx="88" cy="122" r="6.5" stroke="none"></circle>
  <path fill="none" stroke-width="2.4" d="M94 118 L10 86"></path>
  <path fill="none" stroke-width="1" stroke-opacity=".7" d="M10 86 C8 120,6 160,6 200"></path>
</g>
<!-- Figure 2: knees up, warm mug -->
<g id="fig-mug" fill="#66777c" stroke="#66777c" stroke-linecap="round" stroke-linejoin="round">
  <path stroke="none" fill-rule="evenodd" d="M128 64 C141 68,150 80,152 96 C154 112,156 128,156 140 L56 140 C50 140,50 133,56 132 L64 130 C66 118,68 104,72 96 C75 88,84 84,94 88 C100 91,106 98,112 105 C112 96,114 82,118 73 C120 68,124 65,128 64 Z M94 108 C92 118,90 130,88 140 L140 140 C136 128,120 113,94 108 Z"></path>
  <path stroke="none" d="M117 74 L131 67 L129 54 L115 60 Z"></path>
  <ellipse cx="119" cy="52" rx="15" ry="17" transform="rotate(-8 119 52)" stroke="none"></ellipse>
  <path fill="none" stroke-width="11" d="M140 88 C134 98,128 104,120 103 C110 101,98 94,90 87"></path>
  <circle cx="88" cy="86" r="6.5" stroke="none"></circle>
  <rect x="77" y="71" width="17" height="20" rx="4" stroke="none"></rect>
  <path fill="none" stroke-width="1.4" stroke-opacity=".45" d="M82 65 C80 61,84 58,82 53 M89 65 C87 61,91 58,89 53"></path>
</g>
<!-- Figure 3: leaning back, legs stretched out -->
<g id="fig-lean" fill="#66777c" stroke="#66777c" stroke-linecap="round" stroke-linejoin="round">
  <path stroke="none" d="M150 74 C162 78,168 90,166 106 C164 120,162 130,162 140 L44 140 C34 140,28 134,27 124 C26 116,24 106,29 102 C34 99,39 104,40 112 C42 118,50 114,60 110 C66 107,70 104,74 102 C92 98,108 108,120 114 C124 106,130 92,136 82 C140 76,144 74,150 74 Z"></path>
  <path stroke="none" d="M137 81 L153 75 L153 60 L140 66 Z"></path>
  <ellipse cx="146" cy="60" rx="15" ry="17" transform="rotate(6 146 60)" stroke="none"></ellipse>
  <path fill="none" stroke-width="11" d="M160 90 C170 106,182 122,190 136"></path>
  <circle cx="192" cy="137" r="6" stroke="none"></circle>
</g>
</defs>
<rect width="1200" height="290" fill="url(#sky)"></rect>
<rect y="290" width="1200" height="150" fill="url(#sea)"></rect>
<rect y="289" width="1200" height="1.5" fill="#fff" opacity=".35"></rect>
<g mask="url(#reflMask)" opacity="0.16" filter="url(#soft)">
  <use href="#fig-fish" transform="translate(60 500) scale(1.5 -1.5)"></use>
  <use href="#fig-mug" transform="translate(440 500) scale(1.5 -1.5)"></use>
  <use href="#fig-lean" transform="translate(830 500) scale(1.5 -1.5)"></use>
</g>
<g opacity="0.92">
  <use href="#fig-fish" transform="translate(60 80) scale(1.5)"></use>
  <use href="#fig-mug" transform="translate(440 80) scale(1.5)"></use>
  <use href="#fig-lean" transform="translate(830 80) scale(1.5)"></use>
</g>
</svg>
</div>
</div>
</x-dc>
</body>
</html>
