<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    a { color: #3b6b75; } a:hover { color: #26313a; }
    .scene { --sky1:#D9E5E5; --sky2:#E9EEEB; --sky3:#F3F1EA; --back:#A9C3C6; --mid:#86A9AF; --front:#5E8891; --land:#C9CBC3; --sil:#3A4A52; --orb:#F2D8A6; --haze:rgba(255,255,255,.35); --cloud:rgba(255,255,255,.7); --star:0; --sun:1; --moon:0; --glit:1; --warm:0; --lamp:0; --lightning:0; }
    .scene.time-dusk { --sky1:#B9A9B4; --sky2:#E8C6AC; --sky3:#F2E4D2; --back:#B8A9A4; --mid:#8E948F; --front:#5E7780; --land:#C9B8A6; --sil:#3E3A3F; --orb:#F3B98A; --haze:rgba(255,220,190,.35); --cloud:rgba(246,217,193,.7); --sun:0; --glit:1; --warm:1; --lightning:1; }
    .scene.time-night { --sky1:#0F171C; --sky2:#17232A; --sky3:#22313A; --back:#2C4149; --mid:#24363D; --front:#1B2A30; --land:#3A4046; --sil:#8FA3AD; --orb:#D9DFE4; --haze:rgba(255,255,255,.06); --cloud:rgba(255,255,255,.08); --star:1; --sun:0; --moon:1; --glit:0; --lamp:1; --lightning:1; }
    .sky { position:absolute; inset:0; background: linear-gradient(var(--sky1) 0%, var(--sky2) 50%, var(--sky3) 78%); }
    .breathe { position:absolute; inset:0; background: radial-gradient(circle at 50% 45%, var(--sky1), transparent 70%); animation: breathe 14s ease-in-out infinite alternate; }
    @keyframes breathe { from { opacity:0 } to { opacity:.3 } }
    svg.layer { position:absolute; left:0; top:0; width:390px; height:844px; overflow:visible; }
    .sun { fill: var(--orb); opacity: var(--sun); filter: blur(10px); }
    .sunglow { fill: var(--orb); opacity: calc(var(--sun) * .35); filter: blur(28px); }
    .dusksun { fill: var(--orb); opacity: var(--warm); filter: blur(8px); }
    .moon { fill: var(--orb); opacity: var(--moon); }
    .moonglow { fill: #fff; opacity: calc(var(--moon) * .18); filter: blur(22px); }
    .star { fill: #fff; opacity: 0; animation: twinkle 6s ease-in-out infinite; }
    .time-night .star { animation-name: twinkleOn; }
    @keyframes twinkle { from { opacity:0 } to { opacity:0 } }
    @keyframes twinkleOn { 0%,100% { opacity:.25 } 50% { opacity:.85 } }
    .cloud { fill: var(--cloud); filter: blur(5px); animation: cloudDrift linear infinite; }
    .cloud.c1 { animation-duration: 140s; } .cloud.c2 { animation-duration: 190s; animation-delay:-70s; } .cloud.c3 { animation-duration: 230s; animation-delay:-150s; }
    @keyframes cloudDrift { from { transform: translateX(420px) } to { transform: translateX(-300px) } }
    .flash { fill:#fff; opacity:0; filter: blur(14px); animation: lightning 118s linear infinite; }
    @keyframes lightning { 0%,95.6% { opacity:0 } 95.8% { opacity: calc(var(--lightning) * .55) } 96% { opacity:0 } 96.3% { opacity: calc(var(--lightning) * .35) } 96.6% { opacity:0 } 100% { opacity:0 } }
    .haze { fill: var(--haze); }
    .water { animation: bob 4s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-4px) } }
    .band { animation: drift linear infinite; }
    .band.back { fill: var(--back); animation-duration: 28s; }
    .band.mid { fill: var(--mid); animation-duration: 21s; }
    .band.front { fill: var(--front); animation-duration: 16s; }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-390px) } }
    .glit circle { fill:#fff; opacity:0; animation: glint 4s ease-in-out infinite; }
    .time-dusk .glit circle { fill:#F6D9A8; }
    @keyframes glint { 0%,100% { opacity:0 } 50% { opacity: calc(var(--glit) * .7) } }
    .glade { fill:#fff; opacity: calc(var(--moon) * .10); animation: glade 9s ease-in-out infinite alternate; }
    @keyframes glade { from { opacity: calc(var(--moon) * .06) } to { opacity: calc(var(--moon) * .14) } }
    .sil { fill: var(--sil); opacity: .62; }
    .sil.far { opacity: .32; }
    .sil.mid { opacity: .48; }
    .stroke { fill:none; stroke: var(--sil); stroke-opacity:.62; stroke-linecap: round; }

    /* people: one silhouette, one opacity, small living motions */

    .figure { opacity:.8; }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath2 4.6s ease-in-out infinite alternate; }
    @keyframes breath2 { from { transform: scaleY(1) } to { transform: scaleY(1.018) } }
        .fore1 { transform-box: fill-box; transform-origin: 100% 100%; animation: sip 46s ease-in-out infinite; }
    @keyframes sip { 0%,84% { transform: rotate(0) } 87% { transform: rotate(35deg) } 93% { transform: rotate(35deg) } 96% { transform: rotate(0) } 100% { transform: rotate(0) } }
    .figure .fl { fill: var(--sil); }
    .figure .ln { fill:none; stroke: var(--sil); stroke-linecap: round; stroke-linejoin: round; }
    .figure .fb { fill: var(--sil); stroke: var(--sil); stroke-linecap: round; stroke-linejoin: round; }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath2 4.6s ease-in-out infinite alternate; }
    @keyframes breath2 { from { transform: scaleY(1) } to { transform: scaleY(1.025) } }
    .swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 5.2s ease-in-out infinite alternate; }
    .breath { transform-origin: 50% 92%; }
    @keyframes swing { from { transform: rotate(-3deg) } to { transform: rotate(3deg) } }
    .toe { transform-box: fill-box; transform-origin: 50% 100%; animation: toe 22s ease-in-out infinite; }
    @keyframes toe { 0%,88% { transform: rotate(0) } 91% { transform: rotate(-10deg) } 94% { transform: rotate(4deg) } 97%,100% { transform: rotate(0) } }
    .sip { transform-box: fill-box; transform-origin: 100% 100%; animation: sip 46s ease-in-out infinite; }
    @keyframes sip { 0%,84% { transform: rotate(0) } 87% { transform: rotate(40deg) } 93% { transform: rotate(40deg) } 96% { transform: rotate(0) } 100% { transform: rotate(0) } }
    .rodg { transform-box: fill-box; transform-origin: 100% 0%; animation: rodSway 6s ease-in-out infinite alternate; }

    @keyframes rodSway { from { transform: rotate(-1.5deg) } to { transform: rotate(1.5deg) } }
    .bobber { animation: bobber 3s ease-in-out infinite alternate; }
    @keyframes bobber { from { transform: translateY(-1px) } to { transform: translateY(2px) } }
    .ring { fill:none; stroke: var(--sil); stroke-opacity:.5; transform-box: fill-box; transform-origin: center; animation: ring 9s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.4); opacity:.5 } 40% { transform: scale(2.6); opacity:0 } 100% { transform: scale(2.6); opacity:0 } }
    .cattail { transform-box: fill-box; transform-origin: 0% 0%; animation: cattail 7s ease-in-out infinite alternate; }
    @keyframes cattail { from { transform: rotate(-8deg) } to { transform: rotate(7deg) } }
    .heronhead { transform-box: fill-box; transform-origin: 20% 100%; animation: heron 34s ease-in-out infinite; }
    @keyframes heron { 0%,88% { transform: rotate(0) } 91% { transform: rotate(-9deg) } 96% { transform: rotate(-9deg) } 100% { transform: rotate(0) } }
    @keyframes tilt { from { transform: rotate(-5deg) } to { transform: rotate(5deg) } }
    .fin { animation: dolphin 96s linear infinite; }
    .fin.f2 { animation-delay: 1.6s; }
    @keyframes dolphin { 0%,78% { opacity:0; transform: translate(0,10px) } 79.5% { opacity:.9; transform: translate(16px,0) } 81% { opacity:0; transform: translate(34px,10px) } 82.5% { opacity:.9; transform: translate(52px,0) } 84% { opacity:0; transform: translate(70px,10px) } 85.5% { opacity:.9; transform: translate(88px,0) } 87% { opacity:0; transform: translate(106px,10px) } 100% { opacity:0; transform: translate(106px,10px) } }
    .manatee { animation: manatee 210s linear infinite; }
    .time-day .manatee { display:none; }
    @keyframes manatee { 0%,60% { opacity:0; transform: translateY(14px) } 62% { opacity:.55; transform: translateY(0) } 68% { opacity:.55; transform: translateY(1px) } 70% { opacity:0; transform: translateY(14px) } 100% { opacity:0; transform: translateY(14px) } }
    .mullet { animation: mullet 40s linear infinite; }
    .mullet.m2 { animation-delay: -13s; } .mullet.m3 { animation-delay: -27s; }
    @keyframes mullet { 0%,44% { opacity:0; transform: translateY(0) rotate(-20deg) } 45% { opacity:.6 } 46.1% { transform: translateY(-22px) rotate(0) } 47.3% { opacity:.6; transform: translateY(0) rotate(20deg) } 47.4%,100% { opacity:0 } }
    .fish { animation: swim linear infinite; }
    .fish.tarpon { animation-duration: 58s; animation-delay:-27s; }
    .fish.snook { animation-duration: 74s; animation-delay:-50s; }
    .fish.grouper { animation-duration: 210s; animation-delay:-95s; }
    @keyframes swim { from { transform: translateX(430px) } to { transform: translateX(-90px) } }
    .fishbob { animation: fishbob 8s ease-in-out infinite alternate; }
    @keyframes fishbob { from { transform: translateY(-5px) } to { transform: translateY(5px) } }
    .dragonfly { animation: dragon 26s ease-in-out infinite; }
    .time-night .dragonfly, .time-dusk .dragonfly { display:none; }
    @keyframes dragon { 0% { transform: translate(0,0) } 20% { transform: translate(-14px,-6px) } 22% { transform: translate(-14px,-6px) } 45% { transform: translate(10px,-14px) } 50% { transform: translate(10px,-14px) } 75% { transform: translate(-6px,4px) } 100% { transform: translate(0,0) } }
    .lamp { fill: #F2C98A; opacity: calc(var(--lamp) * .9); }
    .lampglow { fill: #F2C98A; opacity: calc(var(--lamp) * .22); filter: blur(10px); animation: lampflicker 5s ease-in-out infinite alternate; }
    @keyframes lampflicker { from { opacity: calc(var(--lamp) * .18) } to { opacity: calc(var(--lamp) * .26) } }
    .boat { animation: boat 3600s linear infinite; animation-delay: -3480s; }
    @keyframes boat { 0% { transform: translateX(-40px); opacity:0 } .3% { opacity:.3 } 4.7% { opacity:.3 } 5% { transform: translateX(420px); opacity:0 } 100% { transform: translateX(420px); opacity:0 } }
    .shadow { fill:#000; opacity:.05; filter: blur(12px); animation: cloudDrift 200s linear infinite; }
  </style>
</helmet>
<div class="scene {{timeClass}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #E9EEEB;">
  <div class="sky"></div>
  <div class="breathe"></div>
  <svg class="layer" viewBox="0 0 390 844" aria-hidden="true">
    <defs>
      <path id="wb" d="M0,634 C97.5,614 97.5,654 195,634 C292.5,614 292.5,654 390,634 L390,844 L0,844 Z"/>
      <path id="wm" d="M0,690 C97.5,674 97.5,706 195,690 C292.5,674 292.5,706 390,690 L390,844 L0,844 Z"/>
      <path id="wf" d="M0,746 C97.5,730 97.5,762 195,746 C292.5,730 292.5,762 390,746 L390,844 L0,844 Z"/>
    </defs>
    <!-- stars -->
    <g class="stars">
      <circle class="star" cx="40" cy="80" r="1.1" style="animation-delay:-1s"/><circle class="star" cx="120" cy="140" r=".9" style="animation-delay:-3s"/><circle class="star" cx="210" cy="60" r="1.2" style="animation-delay:-2s"/><circle class="star" cx="300" cy="200" r=".8" style="animation-delay:-4s"/><circle class="star" cx="70" cy="260" r="1" style="animation-delay:-.5s"/><circle class="star" cx="180" cy="300" r=".9" style="animation-delay:-5s"/><circle class="star" cx="350" cy="90" r="1" style="animation-delay:-2.5s"/><circle class="star" cx="250" cy="380" r=".8" style="animation-delay:-1.5s"/><circle class="star" cx="140" cy="430" r="1" style="animation-delay:-3.5s"/><circle class="star" cx="330" cy="330" r=".9" style="animation-delay:-4.5s"/>
    </g>
    <!-- sun / moon -->
    <circle class="sunglow" cx="330" cy="100" r="90"/>
    <circle class="sun" cx="330" cy="100" r="48"/>
    <circle class="dusksun" cx="60" cy="600" r="64"/>
    <circle class="moonglow" cx="324" cy="122" r="60"/>
    <circle class="moon" cx="324" cy="122" r="26"/>
    <!-- clouds -->
    <g class="cloud c1"><ellipse cx="0" cy="150" rx="70" ry="18"/><ellipse cx="-20" cy="140" rx="34" ry="22"/><ellipse cx="26" cy="142" rx="30" ry="18"/></g>
    <g class="cloud c2"><ellipse cx="0" cy="240" rx="50" ry="13"/><ellipse cx="-10" cy="232" rx="24" ry="15"/></g>
    <g class="cloud c3"><ellipse cx="0" cy="330" rx="90" ry="22"/><ellipse cx="-30" cy="318" rx="44" ry="26"/><ellipse cx="40" cy="322" rx="34" ry="20"/><ellipse class="flash" cx="0" cy="326" rx="70" ry="24"/></g>
    <!-- distant boat -->
    <g class="boat"><path class="sil far" transform="translate(0,628)" d="M2,8 L28,8 L25,11.5 L5,11.5 Z M11,8 L11,4.5 L19,4.5 L19,8 Z M14,4.5 L14,1.5 L15.2,1.5 L15.2,4.5 Z"/></g>
    <!-- horizon haze -->
    <rect class="haze" x="0" y="600" width="390" height="70"/>
    <!-- water -->
    <g class="water">
      <g class="band back"><use href="#wb"/><use href="#wb" transform="translate(390)"/></g>
      <g class="glit" transform="translate(0,650)"><circle cx="20" cy="4" r="1.4" style="animation-delay:-1s"/><circle cx="60" cy="14" r="1.2" style="animation-delay:-2.2s"/><circle cx="95" cy="2" r="1.4" style="animation-delay:-.5s"/><circle cx="130" cy="18" r="1.2" style="animation-delay:-3s"/><circle cx="170" cy="8" r="1.4" style="animation-delay:-1.7s"/><circle cx="205" cy="20" r="1.2" style="animation-delay:-.9s"/><circle cx="240" cy="6" r="1.4" style="animation-delay:-2.6s"/><circle cx="275" cy="16" r="1.2" style="animation-delay:-3.4s"/><circle cx="310" cy="4" r="1.4" style="animation-delay:-.3s"/><circle cx="350" cy="12" r="1.2" style="animation-delay:-1.3s"/></g>
      <rect class="glade" x="290" y="636" width="68" height="200" rx="30"/>
      <ellipse class="shadow" cx="0" cy="700" rx="120" ry="30"/>
      <!-- dolphins, a pair, between back and mid -->
      <g transform="translate(40,672)"><path class="sil mid fin" d="M0,8 C6,4 10,-4 14,-6 C13,0 14,6 18,8 Z"/><g transform="translate(-26,4) scale(.8)"><path class="sil mid fin f2" d="M0,8 C6,4 10,-4 14,-6 C13,0 14,6 18,8 Z"/></g></g>
      <g class="band mid"><use href="#wm"/><use href="#wm" transform="translate(390)"/></g>
      <!-- fish under the mid wave -->
      <g transform="translate(0,716)"><g class="fish tarpon"><g class="fishbob"><path class="sil mid" d="M0,7 C8,0 30,-2 42,5 L52,0 L48,7 L52,14 L42,9 C30,16 8,14 0,7 Z"/></g></g></g>
      <g transform="translate(0,738)"><g class="fish snook"><g class="fishbob" style="animation-duration:6s"><path class="sil mid" d="M0,5 C7,0 26,-1 36,4 L44,0 L41,5 L44,10 L36,6 C26,11 7,10 0,5 Z"/></g></g></g>
      <!-- manatee surfaces near the dock at night and dusk -->
      <g transform="translate(150,728)"><path class="sil mid manatee" d="M0,10 C4,2 20,-4 40,0 C50,2 56,8 58,12 L0,12 Z"/></g>
      <!-- mullet jumps -->
      <g transform="translate(110,700)"><path class="sil mid mullet" d="M0,5 C4,1 12,0 18,4 L20,2 L19,5 L20,8 L18,6 C12,10 4,9 0,5 Z"/></g>
      <g transform="translate(200,700)"><path class="sil mid mullet m2" d="M0,5 C4,1 12,0 18,4 L20,2 L19,5 L20,8 L18,6 C12,10 4,9 0,5 Z"/></g>
      <g transform="translate(60,704)"><path class="sil mid mullet m3" d="M0,5 C4,1 12,0 18,4 L20,2 L19,5 L20,8 L18,6 C12,10 4,9 0,5 Z"/></g>
      <!-- heron on the left, in the shallows, very still -->
      <g transform="translate(28,676)">
        <path class="sil" d="M14,40 L14,64 M20,40 L20,64" style="fill:none;stroke:var(--sil);stroke-opacity:.62;stroke-width:1.4"/>
        <path class="sil" d="M6,26 C6,16 14,10 24,12 C32,14 34,24 30,32 C26,40 12,42 6,36 Z"/>
        <g class="heronhead"><path class="sil" d="M22,14 C22,4 24,-6 28,-14 C30,-16 33,-16 34,-14 L52,-12 L34,-10 C32,-4 30,6 30,14 Z"/></g>
      </g>
      <!-- the dock, the figure, the cat -->
      <g transform="translate(184,622)">
        <rect class="sil" x="18" y="70" width="6" height="60" rx="1.5"/><rect class="sil" x="86" y="72" width="6" height="66" rx="1.5"/><rect class="sil" x="150" y="70" width="6" height="70" rx="1.5"/><rect class="sil" x="200" y="70" width="6" height="66" rx="1.5"/>
        <rect class="sil" x="10" y="64" width="200" height="8" rx="2"/>
        <rect class="lampglow" x="146" y="34" width="14" height="30"/><rect class="sil" x="151" y="40" width="4" height="30"/><circle class="lamp" cx="153" cy="40" r="2.2"/>
        <!-- Paul on the edge of the dock, legs over the water, rod resting -->
<g class="figure" transform="translate(-35,-6) scale(.5)" style="fill:var(--sil);stroke:var(--sil)" stroke-linecap="round" stroke-linejoin="round"><g class="breath">
  <path stroke="none" d="M128 66 C140 70,148 80,148 96 C148 112,150 128,150 140 L90 140 C88 156,84 174,84 188 C84 195,80 199,73 199 L58 202 C52 202,50 196,55 193 L68 190 C66 172,64 156,66 143 C67 128,72 118,84 116 L100 116 C105 112,104 100,108 88 C112 76,116 70,120 67 Z"></path>
  <path stroke="none" d="M118 69 L136 66 L131 54 L115 60 Z"></path>
  <ellipse cx="121" cy="50" rx="15" ry="17" transform="rotate(-8 121 50)" stroke="none"></ellipse>
  <path fill="none" stroke-width="11" d="M138 86 C132 98,124 108,116 113 C108 118,98 121,90 121"></path>
  <circle cx="88" cy="122" r="6.5" stroke="none"></circle>
  <path fill="none" stroke-width="2.4" d="M94 118 L10 86"></path>
  <path fill="none" stroke-width="1" stroke-opacity=".7" d="M10 86 C8 120,6 160,6 200"></path>
</g></g>
        <!-- the cat beside him, tail over the edge -->
        <g class="figure" transform="translate(76,64)">
          <path class="fl" d="M0,0 C0,-14 5,-24 13,-25 C20,-26 25,-20 25,-10 L25,0 Z"/><circle class="fl" cx="12" cy="-29" r="6"/><path class="fl" d="M7,-32 L6,-39 L11,-34 Z M14,-34 L18,-39 L18,-32 Z"/>
          <path class="ln cattail" d="M23,-2 C31,-2 34,6 29,13" style="stroke-width:3"/>
        </g>
        <!-- dragonfly hovering by the pilings (day) -->
        <g transform="translate(120,30)"><g class="dragonfly"><path class="stroke" d="M0,0 L10,0 M2,-1 L-4,-4 M2,1 L-4,4 M7,-1 L2,-5 M7,1 L2,5" style="stroke-width:.8"/></g></g>
      </g>
      <g transform="translate(0,800)"><g class="fish grouper"><g class="fishbob" style="animation-duration:14s"><path class="sil mid" d="M0,12 C10,2 34,-2 50,8 L62,2 L58,12 L62,22 L50,16 C34,26 10,22 0,12 Z"/></g></g></g>
      <g class="band front"><use href="#wf"/><use href="#wf" transform="translate(390)"/></g>
    </g>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"time":{"editor":"enum","options":["day","dusk","night"],"default":"day","section":"Sky"}}'>
class Component extends DCLogic {
  renderVals() { return { timeClass: 'time-' + (this.props.time ?? 'day') }; }
}
</script>
</body>
