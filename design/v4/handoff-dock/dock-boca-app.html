    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif; }
  html[data-place="campo"] { --sky-top:#CFDDEA; --sky-mid:#E4E9EC; --sky-horizon:#F2EEE3; --bg:#F2EEE3; --card:#FCF9F1; --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --card-a:var(--glass); --glass-line:rgba(255,255,255,.6); --line:rgba(40,44,40,.10); --ink:#2C2C27; --muted:#746F63; --accent:#6B7749; --accent-rgb:107,119,73; --accent-ink:#FFFFFF; --accent-soft:rgba(107,119,73,.14); --accent-40:rgba(107,119,73,.40); --orb:#F4D8A0; --orb-rgb:244,216,160; --scene-back:#B4B6C4; --scene-mid:#D9C78F; --scene-front:#BFA765; --scene-land:#A79A7A; --water:#D9C78F; --range:#B4B6C4; --ground:#BFA765; --sand:#A79A7A; --silhouette:#4A463C; --chip:rgba(40,50,55,.06); --track:rgba(120,120,128,.12); }
  html[data-place="keywest"] { --sky-top:#CFE9EC; --sky-mid:#E4F0EE; --sky-horizon:#F4F1E8; --bg:#F4F1E8; --card:#FCFAF3; --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --card-a:var(--glass); --glass-line:rgba(255,255,255,.6); --line:rgba(40,44,40,.10); --ink:#223238; --muted:#67777C; --accent:#2E8A8E; --accent-rgb:46,138,142; --accent-ink:#FFFFFF; --accent-soft:rgba(46,138,142,.14); --accent-40:rgba(46,138,142,.40); --orb:#F7D59B; --orb-rgb:247,213,155; --scene-back:#A6DADB; --scene-mid:#77C2C6; --scene-front:#45A1A8; --scene-land:#EDDDB5; --water:#77C2C6; --range:#A6DADB; --ground:#45A1A8; --sand:#EDDDB5; --silhouette:#34474D; --chip:rgba(40,50,55,.06); --track:rgba(120,120,128,.12); }

  html.night[data-place="campo"] { --sky-top:#0E1220; --sky-mid:#18202F; --sky-horizon:#2A2F38; --bg:#2A2F38; --card:#1C1F26; --glass:rgba(28,31,38,.55); --glass-strong:rgba(28,31,38,.78); --card-a:var(--glass); --glass-line:rgba(255,255,255,.14); --line:rgba(255,255,255,.09); --ink:#EAE6DC; --muted:#9B978C; --accent:#B9BE86; --accent-rgb:185,190,134; --accent-ink:#0E1220; --accent-soft:rgba(185,190,134,.14); --accent-40:rgba(185,190,134,.40); --orb:#E1E4E8; --orb-rgb:225,228,232; --scene-back:#343A4B; --scene-mid:#3A3728; --scene-front:#2A281D; --scene-land:#3A362C; --water:#3A3728; --range:#343A4B; --ground:#2A281D; --sand:#3A362C; --silhouette:#9A9483; --chip:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); }
  html.night[data-place="keywest"] { --sky-top:#0B161D; --sky-mid:#142530; --sky-horizon:#23384A; --bg:#23384A; --card:#17252C; --glass:rgba(23,37,44,.55); --glass-strong:rgba(23,37,44,.78); --card-a:var(--glass); --glass-line:rgba(255,255,255,.14); --line:rgba(255,255,255,.09); --ink:#E5EAE8; --muted:#8FA3A9; --accent:#7FC7C9; --accent-rgb:127,199,201; --accent-ink:#0B161D; --accent-soft:rgba(127,199,201,.14); --accent-40:rgba(127,199,201,.40); --orb:#DDE5E8; --orb-rgb:221,229,232; --scene-back:#26454F; --scene-mid:#1E3A44; --scene-front:#172D36; --scene-land:#3B3A32; --water:#1E3A44; --range:#26454F; --ground:#172D36; --sand:#3B3A32; --silhouette:#93A8AE; --chip:rgba(255,255,255,.07); --track:rgba(255,255,255,.08); }
  /* dusk is a gradient over the day palette, per place */
  html[data-sky="evening"]:not(.night) { --sky-top:#B9A9B4; --sky-mid:#E8C6AC; --sky-horizon:#F2E4D2; --bg:#F2E4D2; }
  html[data-sky="evening"][data-place="campo"]:not(.night) { --sky-top:#A79BC0; --sky-mid:#EBBF9C; --sky-horizon:#F4E3CE; --bg:#F4E3CE; }
  html[data-sky="evening"][data-place="keywest"]:not(.night) { --sky-top:#D39C9C; --sky-mid:#F2BE9B; --sky-horizon:#EEE3CE; --bg:#EEE3CE; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--ink); font: 17px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  html { background: var(--sky-horizon); }
  body { min-height: 100dvh; display: flex; flex-direction: column; background: linear-gradient(var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-horizon) 78%) top / 100% 100dvh no-repeat, var(--sky-horizon); transition: background-color 1.5s; }
  main { flex: 1; padding: calc(16px + env(safe-area-inset-top)) 24px 142px; max-width: 640px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
  .hidden { display: none !important; }

  h1 { font-family: var(--serif); font-size: 36px; line-height: 1.2; margin: 0; font-weight: 300; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  section.pane { opacity: 0; transition: opacity .4s ease-in-out; }
  section.pane.in { opacity: 1; }

  /* ---------- frosted surfaces ---------- */
  .frost { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2); border: 1px solid var(--glass-line); box-shadow: 0 10px 30px rgba(20,30,35,.07); }

  /* ---------- Today ---------- */
  .headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .pill { display: inline-flex; align-items: center; font: inherit; font-size: 13px; line-height: 1; padding: 7px 12px; border-radius: 999px; background: var(--chip); color: var(--muted); border: 0; margin-top: 8px; }
  .pill.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  #rain-toggle { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 20px; padding: 0; display: flex; align-items: center; justify-content: center; background: var(--glass); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border: 1px solid var(--glass-line); color: var(--muted); opacity: .75; z-index: 3; position: relative; }
  #rain-toggle svg { width: 22px; height: 22px; }
  #rain-toggle.on { opacity: 1; color: var(--accent); }

  .entry-glass { margin-top: 20px; border-radius: 28px; transition: border-color .25s, box-shadow .25s; }
  .entry-glass:focus-within { border-color: var(--accent-40); box-shadow: 0 0 0 3px var(--accent-soft), 0 10px 30px rgba(20,30,35,.07); }
  .textview { width: 100%; display: block; font: inherit; font-size: 17px; line-height: 1.5; color: var(--ink); background: transparent; border: 0; border-radius: 28px; padding: 18px 20px 6px; min-height: 112px; resize: none; outline: none; }
  .entry-glass .reassure { margin: 0; padding: 0 20px 14px; text-align: left; font-size: 12px; line-height: 1.5; opacity: .8; }
  .textview::placeholder { color: var(--muted); }
  

  .voice { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 20px; }
  .mic-wrap { position: relative; width: 80px; height: 80px; isolation: isolate; }
  .mic-wrap::before, .mic-wrap::after { content: ""; position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none; }
  .mic-wrap::before { width: 100px; height: 100px; margin: -50px 0 0 -50px; border: 1px solid rgba(var(--accent-rgb),.24); }
  .mic-wrap::after { width: 124px; height: 124px; margin: -62px 0 0 -62px; background: rgba(var(--accent-rgb),.12); filter: blur(8px); z-index: -1; animation: halo 10s ease-in-out infinite alternate; }
  @keyframes halo { from { transform: scale(.94); opacity: .7; } to { transform: scale(1.04); opacity: 1; } }
  .mic { position: relative; z-index: 1; width: 80px; height: 80px; border-radius: 40px; border: 0; padding: 0; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(var(--accent-rgb),.28); transition: transform .15s; }
  .mic:active { transform: scale(.96); }
  .mic svg { width: 32px; height: 32px; }
  .ring { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0; pointer-events: none; }
  body.listening .ring { animation: ringOut 3s ease-out infinite; }
  body.listening .ring.r2 { animation-delay: 1s; }
  body.listening .ring.r3 { animation-delay: 2s; }
  @keyframes ringOut { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(1.6); opacity: 0; } }

  .voice-cap { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--muted); height: 20px; }
  .voice-cap svg { width: 16px; height: 16px; flex: 0 0 auto; }
  body.listening .voice-cap .kb { display: none; }

  .moods { display: flex; justify-content: space-between; gap: 6px; margin: 20px 0 0; }
  .moods button { flex: 0 0 auto; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; padding: 0; background: transparent; border: 0; border-radius: 50%; transition: transform .12s; }
  .moods button svg { width: 50px; height: 50px; }
  .moods button.on { transform: scale(1.06); box-shadow: 0 0 0 2px var(--accent); }

  .face.m1 { color: var(--m1); } .face.m2 { color: var(--m2); } .face.m3 { color: var(--m3); }
  .face.m4 { color: var(--m4); } .face.m5 { color: var(--m5); } .face.m6 { color: var(--m6); }
  .face .mood-bg { fill: currentColor; fill-opacity: .18; stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; }
  .face .mood-eye { fill: currentColor; }
  .face .mood-mouth { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .face .mood-brow { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .moods button.on .mood-bg { fill-opacity: 1; }
  .moods button.on .mood-eye { fill: var(--card); }
  .moods button.on .mood-mouth { stroke: var(--card); }
  .moods button.on .mood-brow { stroke: var(--card); }

  .btn { font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 26px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); width: 100%; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:disabled { opacity: .35; }
  .btn svg { width: 18px; height: 18px; }
  .btn.ghost { background: var(--glass); color: var(--accent); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(20,30,35,.07); }
  #save { min-height: 54px; border-radius: 27px; transition: background .4s, color .4s, opacity .4s; }
  /* status: a few words for the circle, beside Save. Hidden when you are not in a circle. */
  .saverow { display: flex; gap: 8px; margin-top: 18px; align-items: stretch; }
  .saverow #save { flex: 0 0 112px; width: auto; }
  .saverow.solo #save { flex: 1; }
  .saverow.solo #status { display: none; }
  #status { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--ink); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 27px; padding: 0 18px; min-height: 54px; outline: none; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(20,30,35,.07); transition: border-color .25s, box-shadow .25s; }
  #status::placeholder { color: var(--muted); }
  #status:focus { border-color: var(--accent-40); box-shadow: 0 0 0 3px var(--accent-soft), 0 10px 30px rgba(20,30,35,.07); }
  /* message in a bottle: a friend's words live in the scene, not in a feed. Only there when someone wrote something today. */
  #bottle { --tilt: -28deg; position: fixed; left: 9%; bottom: 112px; width: 14px; height: 24px; padding: 10px; margin: -10px; box-sizing: content-box; border: 0; background: none; z-index: 1; display: none; transform: rotate(var(--tilt)); animation: bottleBob 3.4s ease-in-out infinite alternate; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #bottle.show { display: block; }
  #bottle svg { width: 14px; height: 24px; display: block; overflow: visible; }
  #bottle g { opacity: .62; }
  #bottle .glass { fill: var(--silhouette); }
  #bottle .note { fill: var(--bg); }
  html[data-place="campo"] #bottle { --tilt: 22deg; bottom: 100px; animation: none; }
  html[data-place="keywest"] #bottle { --tilt: -34deg; }
  @keyframes bottleBob { from { transform: rotate(var(--tilt)) translateY(0); } to { transform: rotate(calc(var(--tilt) + 6deg)) translateY(-3px); } }
  #bottle-note { position: fixed; left: 15%; bottom: 158px; z-index: 3; max-width: 260px; padding: 11px 16px; border-radius: 22px; background: var(--glass-strong); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(20,30,35,.07); font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 15px; line-height: 1.45; color: var(--ink); opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .35s, transform .35s; }
  #bottle-note.show { opacity: 1; transform: none; }
  #bottle-note div + div { margin-top: 4px; }
  #save:disabled { opacity: .7; }
  #save:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.quiet { background: var(--chip); color: var(--ink); }
  .btn.mid { min-height: 42px; padding: 10px 16px; font-size: 15px; border-radius: 21px; }
  .btn.small { width: auto; min-height: 40px; padding: 8px 16px; font-size: 14px; border-radius: 20px; }
  .btn.danger { background: transparent; color: var(--danger); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > .btn { flex: 1; }

  .reassure { text-align: center; font-size: 13px; line-height: 1.6; color: var(--muted); margin: 24px 0 0; }

  /* ---------- entry cards ---------- */
  .daylist { margin-top: 24px; }
  .entry { border-radius: 22px; padding: 16px 18px; margin-bottom: 10px; }
  .entry .meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .entry .meta .face { flex: 0 0 auto; }
  .entry .text { font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry.clamped .text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .entry .tools { display: flex; gap: 8px; margin-top: 12px; }
  .entry textarea { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 96px; margin-top: 6px; outline: none; }
  .entry .moods { margin: 10px 0; justify-content: flex-start; gap: 4px; }
  .entry .moods button { width: 40px; height: 40px; }
  .entry .moods button svg { width: 40px; height: 40px; }
  .lead { font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; }

  /* ---------- tab bar ---------- */
  nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); width: 270px; transform: translateX(-50%); z-index: 4; display: flex; justify-content: center; padding: 0; border-radius: 32px; overflow: hidden; background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2); border: 1px solid var(--glass-line); box-shadow: 0 10px 30px rgba(20,30,35,.10); }
  nav button { flex: 1; background: none; border: 0; font: inherit; font-size: 11px; font-weight: 500; color: var(--muted); padding: 10px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 62px; }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--accent); font-weight: 600; }

  /* ---------- month strip ---------- */
  .month { margin-top: 18px; }
  .month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month-head b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .mnav { width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 20px; }
  .mnav svg { width: 18px; height: 18px; }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 0; justify-items: center; }
  .mgrid .dow { font-size: 13px; color: var(--muted); }
  .mcell { width: 40px; height: 40px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 20px; }
  .mcell i { display: block; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); }
  .mcell.has i { border-color: transparent; }
  .mcell.today i { box-shadow: 0 0 0 2px var(--accent); }
  .mcell.sel { background: var(--accent-soft); }
  .mcell.blank { visibility: hidden; }

  /* ---------- mood log: which faces this month, tap one to filter ---------- */
  .moodlog { display: flex; justify-content: space-between; margin: 14px 0 0; }
  .moodlog button { flex: 0 0 auto; width: 44px; background: transparent; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 14px; font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); }
  .moodlog button svg { width: 36px; height: 36px; border-radius: 50%; }
  .moodlog button.zero { opacity: .35; }
  .moodlog button.on svg { box-shadow: 0 0 0 2px var(--accent); }
  .moodlog button.on { color: var(--ink); }
  .moodlog-cap { margin: 6px 0 0; text-align: center; font-size: 13px; color: var(--muted); min-height: 20px; }

  /* ---------- search + segmented ---------- */
  .search { position: relative; margin-top: 18px; }
  .search svg { position: absolute; left: 15px; top: 50%; margin-top: -9px; width: 18px; height: 18px; color: var(--muted); }
  .search input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--track); border: 0; border-radius: 16px; padding: 14px 14px 14px 42px; outline: none; min-height: 52px; }
  .search input::placeholder { color: var(--muted); }

  .seg { position: relative; display: flex; background: var(--track); border-radius: 12px; padding: 2px; margin-top: 14px; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 10px; background: var(--glass-strong); box-shadow: 0 1px 3px rgba(0,0,0,.10); transition: transform .25s ease, width .25s ease; }
  .seg button { position: relative; z-index: 1; flex: 1; background: none; border: 0; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); opacity: .72; padding: 12px 4px; min-height: 46px; border-radius: 10px; }
  .seg button.on { opacity: 1; font-weight: 600; }
  .seg.compact button { min-height: 28px; padding: 6px 2px; font-size: 12px; white-space: nowrap; }
  .seg.compact { margin-top: 10px; }

  /* ---------- day groups ---------- */
  .day { margin-bottom: 22px; }
  .dayhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0 0 8px; text-align: left; color: inherit; }
  .dayhead b { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--ink); }
  .dayhead .arc { flex: 0 0 auto; }
  .arc-line { fill: none; stroke: var(--accent); stroke-opacity: .4; stroke-width: 2; stroke-linecap: round; }

  .empty { color: var(--muted); text-align: center; padding: 36px 10px; font-size: 15px; }

  /* ---------- export: a settings screen. One card for you, then grouped lists ---------- */
  .hero { border-radius: 22px; padding: 18px 20px; margin-bottom: 22px; }
  .hero b { display: block; font-size: 20px; font-weight: 600; }
  .hero .sub { margin: 2px 0 0; }
  .stats { display: flex; gap: 10px; margin: 14px 0 0; }
  .stats div { flex: 1; text-align: center; background: var(--track); border-radius: 14px; padding: 12px 4px; }
  .stats b { display: block; font-size: 20px; font-weight: 600; }
  .stats span { font-size: 12px; color: var(--muted); }
  .group { margin-bottom: 22px; }
  .group h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 16px; }
  .group .foot { font-size: 12px; line-height: 16px; color: var(--muted); margin: 6px 16px 0; }
  .group .foot:empty { display: none; }
  .list { border-radius: 18px; overflow: hidden; }
  .list .wrap { display: contents; }
  .list .item, .list .sub { position: relative; }
  .list .item::before, .list .sub::before { content: ""; position: absolute; left: 58px; right: 0; top: 0; height: 1px; background: var(--line); }
  .list .item:first-child::before, .list .sub:first-child::before, .list .sub::before { display: none; }
  .list .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; min-height: 52px; background: none; border: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); text-align: left; }
  .list button.item:active { background: var(--track); }
  .list .item.danger { color: var(--danger); }
  .list .tile { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent-ink); transition: background .25s; }
  .list .tile.muted { background: var(--muted); color: var(--card); }
  .list .tile.danger { background: var(--danger); }
  .list .tile svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .list .tile svg.mark { fill: currentColor; stroke: none; width: 16px; height: 12px; }
  .list .lbl { flex: 1; min-width: 0; }
  .list .val { color: var(--muted); font-weight: 400; }
  .list .chev { width: 8px; height: 14px; fill: none; stroke: var(--muted); stroke-opacity: .7; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .list .check { width: 16px; height: 16px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
  .list .item.on .check { opacity: 1; }
  .list .sub { padding: 4px 16px 14px; }
  .list .sub .seg { margin-top: 0; }
  label.small { font-size: 13px; color: var(--muted); display: block; margin: 10px 0 4px; }
  input.field { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; outline: none; margin-bottom: 8px; }
  input.field:focus { border-color: var(--accent); }
  /* ---------- the switch, iOS-shaped ---------- */
  .switch { flex: 0 0 auto; width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 0; background: var(--track); transition: background .25s ease; position: relative; }
  .switch i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 3px rgba(0,0,0,.14); transition: transform .25s ease; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"] i { transform: translateX(20px); }
  .switch[disabled] { opacity: .45; }

  /* ---------- circle: friends' last seven days under the mood log ---------- */
  .circle:empty { display: none; }
  .circle .friend { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .circle .friend b { font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .circle .friend .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-right: 10px; }
  .circle .friend small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .circle .place-mark { width: 14px; height: 11px; fill: var(--muted); opacity: .8; flex: 0 0 auto; }
  .circle .week { display: flex; gap: 6px; }
  .circle .week i { display: block; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); }
  .circle .week svg { display: block; }
  input[type=date] { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; outline: none; }
  .closing { text-align: center; font-size: 13px; color: var(--muted); margin: 18px 0 0; }

  /* ---------- day sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 10; }
  .sheet .backdrop { position: absolute; inset: 0; background: rgba(20,26,29,0.35); opacity: 0; transition: opacity .4s ease-out; }
  .sheet.in .backdrop { opacity: 1; }
  .sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92dvh; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--card); border-radius: 28px 28px 0 0; padding: 8px 24px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .5s ease-out; box-shadow: 0 -8px 30px rgba(0,0,0,.12); }
  .sheet.in .panel { transform: translateY(0); }
  .grabber { width: 58px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 16px; }
  .sheet .done { position: absolute; top: 18px; right: 20px; border: 0; background: none; font: inherit; font-size: 16px; font-weight: 600; color: var(--accent); padding: 8px 4px; }
  .sheet h2 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0; }
  .sheet .date { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .arc-big { background: var(--track); border-radius: 18px; padding: 12px; margin: 18px 0; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }

  /* ---------- waves and scene (preserved) ---------- */
  .waves { position: fixed; left: 0; right: 0; bottom: 0; height: calc(28vh + var(--tide, 0px)); pointer-events: none; z-index: 0; overflow: hidden; transition: transform 2.5s ease-out; }
  body.listening .waves { transform: translateY(-12px); }
  .waves .wave-wrap { position: absolute; inset: 0; animation: bob 3s ease-in-out infinite alternate; }
  .waves svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; }
  .waves svg.w1 { animation: drift 14s linear infinite; }
  .waves svg.w2 { animation: drift 11s linear infinite; }
  .waves svg.w3 { animation: drift 9s linear infinite; }
  .waves path.w1 { fill: var(--scene-back); opacity: 1; }
  .waves svg.w2 { height: 78%; top: auto; }
  .waves svg.w3 { height: 52%; top: auto; }
  html[data-sky="evening"]:not(.night) .waves path.w1 { fill: color-mix(in srgb, var(--scene-back) 80%, #D8A58C); }
  
  .waves path.w2 { fill: var(--scene-mid); opacity: 1; }
  .waves path.w3 { fill: var(--scene-front); opacity: .76; }
  /* dusk warms the whole scene a little */
  .waves::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(233,169,124,.28), rgba(233,169,124,0)); opacity: 0; transition: opacity 2s; z-index: 3; }
  html[data-sky="evening"]:not(.night) .waves::after { opacity: 1; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  .waves svg.dock { position: absolute; right: 0; left: auto; bottom: 42%; width: 150px; height: 86px; pointer-events: none; overflow: visible; }
  .dock .dock-figure { fill: var(--silhouette); opacity: .55; }
  .dock .dock-figure .arm { fill: none; stroke: var(--silhouette); stroke-width: 4.6; stroke-linecap: round; }
  .dock .rod { transform-box: fill-box; transform-origin: 100% 28%; animation: rodSway 5s ease-in-out infinite alternate; }
  .dock .rod .rod-pole { fill: none; stroke: var(--silhouette); stroke-width: 1.8; stroke-linecap: round; }
  @keyframes rodSway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  @keyframes ringPulse {
    0%   { transform: scale(1); opacity: .35; }
    33%  { transform: scale(3); opacity: 0; }
    100% { transform: scale(3); opacity: 0; }
  }



  .waves .mullet-wrap { position: absolute; bottom: 40%; pointer-events: none; }
  .waves .mullet-wrap.mu1 { left: 30%; }
  .waves .mullet-wrap.mu2 { left: 44%; }
  .waves .mullet-wrap.mu3 { left: 58%; }
  .mullet-wrap .mullet { display: block; width: 22px; height: auto; overflow: visible; animation: mulletJump 60s linear infinite; }
  .mullet-wrap.mu1 .mullet { animation-delay: 0s; }
  .mullet-wrap.mu2 .mullet { animation-delay: -20s; }
  .mullet-wrap.mu3 .mullet { animation-delay: -40s; }
  .mullet use { fill: var(--accent); opacity: .5; }
  @keyframes mulletJump {
    0%, 44%   { transform: translateY(0) rotate(-20deg); opacity: 0; }
    45%       { opacity: .5; }
    45.75%    { transform: translateY(-22px) rotate(0deg); }
    46.5%     { transform: translateY(0) rotate(20deg); opacity: .5; }
    46.55%, 100% { opacity: 0; }
  }
  .mullet-wrap .splash { position: absolute; left: -5px; bottom: -2px; width: 28px; height: 28px; animation: splash 60s linear infinite; }
  .mullet-wrap.mu1 .splash { animation-delay: 0s; }
  .mullet-wrap.mu2 .splash { animation-delay: -20s; }
  .mullet-wrap.mu3 .splash { animation-delay: -40s; }
  .splash circle { fill: none; stroke: var(--accent); stroke-width: 1; }
  @keyframes splash {
    0%, 46.3% { transform: scale(.3); opacity: 0; }
    46.6%     { opacity: .4; }
    50.6%     { transform: scale(1); opacity: 0; }
    100%      { opacity: 0; }
  }

  .waves .fish-wrap { position: absolute; inset: 0; pointer-events: none; }
  /* living water: every wrap carries one fish (or school) along its own path: translate, then a turn (scaleX), then pitch.
     The origin sits on the fish so turns and pitch happen in place. Nose always leads: pinfish, mackerel and snapper are drawn facing right.
     Two shared clocks make the animals notice each other: snook, pinfish and barracuda run on one 130 s cycle (delay -18 s),
     blacktip and snappers on one 150 s cycle (delay -100 s); the jack (120 s) is phased to the mullet (40 s) so one jumps clear of its nose. */
  .waves .fish-wrap { animation-timing-function: cubic-bezier(.35,.15,.65,.85); animation-iteration-count: infinite; }
  /* every fish is one silhouette: the body sways from a point behind the head, the whole fish bobs */
  .waves svg.fish { position: absolute; left: 0; height: auto; overflow: visible; pointer-events: none; fill: var(--accent); animation: fishBob 8s ease-in-out infinite alternate; }
  /* depth: three tiers, still one fill each. Far fish are hazed toward the water (color-mix), smaller, paler and bob less; near fish are fuller and bob more */
  .waves svg.fish.far  { fill: color-mix(in srgb, var(--accent) 62%, var(--scene-mid)); animation-duration: 11s; }
  .waves svg.fish.near { fill: color-mix(in srgb, var(--accent) 100%, var(--scene-front)); animation-name: fishBobNear; }
  @keyframes fishBobNear { from { transform: translateY(-5px); } to { transform: translateY(5px); } }
  .waves svg.fish use { transform-box: fill-box; transform-origin: 30% 50%; animation: sway 2.4s ease-in-out infinite alternate; }
  .pin use, .fish8 use, .snap.s1 use, .snap.s3 use, .snap.s4 use { transform-origin: 70% 50%; }
  @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  @keyframes fishBob { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
  /* tarpon: crosses, climbs to roll at the surface, sinks again; later comes back the other way, deeper */
  .waves .fish-wrap.fw1 { transform-origin: 33px calc(66% - 13px); animation-name: swimTarpon; animation-duration: 96s; animation-delay: -12s; }
  @keyframes swimTarpon {
    0%   { transform: translate(112vw, 0) scaleX(1) rotate(0deg); }
    18%  { transform: translate(62vw, 4px) scaleX(1) rotate(-2deg); }
    24%  { transform: translate(50vw, -34px) scaleX(1) rotate(14deg); }
    26%  { transform: translate(46vw, -40px) scaleX(1) rotate(0deg); }
    29%  { transform: translate(40vw, -20px) scaleX(1) rotate(-12deg); }
    34%  { transform: translate(30vw, 6px) scaleX(1) rotate(0deg); }
    48%  { transform: translate(-25vw, 0) scaleX(1) rotate(0deg); }
    50%  { transform: translate(-25vw, 30px) scaleX(-1) rotate(0deg); }
    62%  { transform: translate(-25vw, 30px) scaleX(-1) rotate(0deg); }
    74%  { transform: translate(40vw, 20px) scaleX(-1) rotate(3deg); }
    86%  { transform: translate(112vw, 26px) scaleX(-1) rotate(0deg); }
    100% { transform: translate(112vw, 0) scaleX(1) rotate(0deg); }
  }
  .waves svg.fish.fish1 { width: 58px; bottom: 34%; opacity: .2; animation: tarponRoll 96s ease-in-out infinite; animation-delay: -12s; }
  .fish1 use { animation-duration: 3.2s; }
  @keyframes tarponRoll { 0%, 24% { transform: scaleY(1); } 26% { transform: scaleY(.68); } 28.5%, 100% { transform: scaleY(1); } }
  /* snook: a resident on the 130 s clock. Holds by the piling facing the current, tenses, strikes the pinfish at 33 % (the school scatters at the same
     moment), coasts out of the strike, turns, and drifts home along the bottom of its band */
  .waves .fish-wrap.fw2 { transform-origin: 28px calc(60% - 10px); animation-name: swimSnook; animation-duration: 130s; animation-delay: -18s; }
  @keyframes swimSnook {
    0%    { transform: translate(64vw, 0) scaleX(1) rotate(0deg); }
    12%   { transform: translate(62vw, 3px) scaleX(1) rotate(0deg); }
    24%   { transform: translate(64vw, 1px) scaleX(1) rotate(0deg); }
    31%   { transform: translate(63vw, 0) scaleX(1) rotate(2deg); }
    31.6% { transform: translate(60vw, -2px) scaleX(1) rotate(4deg); }
    33.2% { transform: translate(45vw, -8px) scaleX(1) rotate(3deg); }
    36%   { transform: translate(39vw, -4px) scaleX(1) rotate(0deg); }
    41%   { transform: translate(37vw, 0) scaleX(1) rotate(0deg); }
    43%   { transform: translate(36vw, 1px) scaleX(-1) rotate(0deg); }
    58%   { transform: translate(52vw, 6px) scaleX(-1) rotate(-3deg); }
    72%   { transform: translate(66vw, 2px) scaleX(-1) rotate(0deg); }
    75%   { transform: translate(67vw, 1px) scaleX(1) rotate(0deg); }
    100%  { transform: translate(64vw, 0) scaleX(1) rotate(0deg); }
  }
  .waves svg.fish.fish2 { width: 56px; bottom: 40%; opacity: .25; animation-duration: 10s; }
  /* jack crevalle: one fast dipping pass, a long nothing, then back the other way higher up.
     120 s is two mullet cycles: with this delay the middle mullet (mu2, left 44 %) jumps clear just ahead of the jack's nose on the left-going pass */
  .waves .fish-wrap.fw4 { transform-origin: 25px calc(64% - 8px); animation-name: swimJack; animation-duration: 120s; animation-delay: -59.7s; }
  @keyframes swimJack {
    0%   { transform: translate(112vw, 0) scaleX(1) rotate(0deg); }
    3%   { transform: translate(80vw, 14px) scaleX(1) rotate(-8deg); }
    6%   { transform: translate(45vw, -6px) scaleX(1) rotate(7deg); }
    9%   { transform: translate(10vw, 8px) scaleX(1) rotate(-4deg); }
    11%  { transform: translate(-25vw, 0) scaleX(1) rotate(0deg); }
    50%  { transform: translate(-25vw, -20px) scaleX(-1) rotate(0deg); }
    53%  { transform: translate(10vw, -10px) scaleX(-1) rotate(-6deg); }
    57%  { transform: translate(55vw, -24px) scaleX(-1) rotate(5deg); }
    61%  { transform: translate(112vw, -14px) scaleX(-1) rotate(0deg); }
    100% { transform: translate(112vw, 0) scaleX(1) rotate(0deg); }
  }
  .waves svg.fish.fish4 { width: 50px; bottom: 36%; opacity: .24; animation-duration: 5s; }
  .fish4 use { animation-duration: .9s; transform-origin: 35% 50%; }
  /* barracuda: on the 130 s clock. Arrives at 20 %, hangs dead still under the school's turning point from 24 % to 58 %, then is gone in a flash beneath them */
  .waves .fish-wrap.fw5 { animation-name: swimCuda; animation-duration: 130s; animation-delay: -18s; animation-timing-function: linear; }
  @keyframes swimCuda {
    0%   { transform: translateX(110vw); }
    20%  { transform: translateX(62vw); animation-timing-function: ease-out; }
    24%  { transform: translateX(59vw); }
    58%  { transform: translateX(57vw); animation-timing-function: cubic-bezier(.7,0,.9,.4); }
    61%  { transform: translateX(-140px); }
    100% { transform: translateX(-140px); }
  }
  .waves svg.fish.fish5 { width: 56px; bottom: 22%; opacity: .17; animation-duration: 13s; }
  .fish5 use { animation-duration: 1.6s; }
  /* pinfish: the school on the 130 s clock. Wanders in, stops to feed, is hit by the snook at 33 % (wrap flees right and up, each fish bursts its own way,
     regroups by 37 %), rises and turns when it meets the hanging barracuda at 39 %, hurries off, feeds again, and leaves */
  .waves .fish-wrap.fw6 { transform-origin: 32px 57%; animation-name: swimSchool; animation-duration: 130s; animation-delay: -18s; }
  @keyframes swimSchool {
    0%    { transform: translate(-25vw, 0) scaleX(1); }
    14%   { transform: translate(22vw, 4px) scaleX(1); }
    22%   { transform: translate(24vw, 10px) scaleX(1); }
    29%   { transform: translate(38vw, 2px) scaleX(1); }
    33%   { transform: translate(44vw, 0) scaleX(1); }
    33.8% { transform: translate(52vw, -10px) scaleX(1); }
    37%   { transform: translate(54vw, -6px) scaleX(1); }
    39%   { transform: translate(56vw, -14px) scaleX(1); }
    40%   { transform: translate(56vw, -14px) scaleX(-1); }
    45%   { transform: translate(42vw, -6px) scaleX(-1); }
    54%   { transform: translate(18vw, 6px) scaleX(-1); }
    56%   { transform: translate(17vw, 6px) scaleX(1); }
    66%   { transform: translate(30vw, 12px) scaleX(1); }
    74%   { transform: translate(34vw, 10px) scaleX(1); }
    100%  { transform: translate(115vw, -4px) scaleX(1); }
  }
  /* each pinfish: its own small orbit, a nose-down feed in the two holds (right-facing art, so nose down is rotate(+)), a burst away from the snook
     at 33 %. Same 130 s clock and delay as the wrap so the beats line up */
  .waves svg.fish.pin { width: 16px; opacity: .26; animation: pinP1 130s ease-in-out infinite; animation-delay: -18s; }
  .waves svg.fish.pin.p1 { bottom: 44%; left: 0; }
  .waves svg.fish.pin.p2 { bottom: 47%; left: 22px; animation-name: pinP2; }
  .waves svg.fish.pin.p3 { bottom: 42%; left: 26px; animation-name: pinP3; }
  .waves svg.fish.pin.p4 { bottom: 45%; left: 48px; animation-name: pinP4; }
  .waves svg.fish.pin.p5 { bottom: 40%; left: 12px; animation-name: pinP5; }
  .pin use { animation-duration: .7s; }
  @keyframes pinP1 {
    0%    { transform: translate(0, 0) rotate(0deg); }
    10%   { transform: translate(3px, -2px) rotate(0deg); }
    16%   { transform: translate(1px, 0) rotate(0deg); }
    17.5% { transform: translate(1px, 4px) rotate(24deg); }
    20%   { transform: translate(0, 4px) rotate(24deg); }
    21.5% { transform: translate(0, 0) rotate(0deg); }
    33%   { transform: translate(0, 0) rotate(0deg); }
    33.8% { transform: translate(-7px, 9px) rotate(-10deg); }
    37%   { transform: translate(1px, 1px) rotate(0deg); }
    48%   { transform: translate(-2px, 1px) rotate(0deg); }
    68%   { transform: translate(-1px, 0) rotate(0deg); }
    69.5% { transform: translate(-1px, 3px) rotate(22deg); }
    72%   { transform: translate(0, 3px) rotate(22deg); }
    73.5% { transform: translate(0, 0) rotate(0deg); }
    100%  { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes pinP2 {
    0%    { transform: translate(0, 0) rotate(0deg); }
    8%    { transform: translate(-2px, 2px) rotate(0deg); }
    19%   { transform: translate(1px, 0) rotate(0deg); }
    20.5% { transform: translate(1px, 4px) rotate(26deg); }
    23%   { transform: translate(0, 4px) rotate(26deg); }
    24.5% { transform: translate(0, 0) rotate(0deg); }
    33%   { transform: translate(0, 0) rotate(0deg); }
    33.8% { transform: translate(10px, -8px) rotate(6deg); }
    37%   { transform: translate(1px, 1px) rotate(0deg); }
    50%   { transform: translate(3px, 2px) rotate(0deg); }
    66%   { transform: translate(-1px, 0) rotate(0deg); }
    67.5% { transform: translate(-1px, 3px) rotate(24deg); }
    70%   { transform: translate(0, 3px) rotate(24deg); }
    71.5% { transform: translate(0, 0) rotate(0deg); }
    100%  { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes pinP3 {
    0%    { transform: translate(0, 0) rotate(0deg); }
    12%   { transform: translate(2px, 2px) rotate(0deg); }
    23.5% { transform: translate(1px, 0) rotate(0deg); }
    25%   { transform: translate(1px, 4px) rotate(28deg); }
    27.5% { transform: translate(0, 4px) rotate(28deg); }
    29%   { transform: translate(0, 0) rotate(0deg); }
    33%   { transform: translate(0, 0) rotate(0deg); }
    33.8% { transform: translate(-9px, -6px) rotate(-8deg); }
    37%   { transform: translate(1px, 1px) rotate(0deg); }
    46%   { transform: translate(-3px, 0) rotate(0deg); }
    71%   { transform: translate(-1px, 0) rotate(0deg); }
    72.5% { transform: translate(-1px, 3px) rotate(24deg); }
    75%   { transform: translate(0, 3px) rotate(24deg); }
    76.5% { transform: translate(0, 0) rotate(0deg); }
    100%  { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes pinP4 {
    0%    { transform: translate(0, 0) rotate(0deg); }
    9%    { transform: translate(-3px, -1px) rotate(0deg); }
    15%   { transform: translate(1px, 0) rotate(0deg); }
    16.5% { transform: translate(1px, 4px) rotate(25deg); }
    19%   { transform: translate(0, 4px) rotate(25deg); }
    20.5% { transform: translate(0, 0) rotate(0deg); }
    33%   { transform: translate(0, 0) rotate(0deg); }
    33.8% { transform: translate(12px, 6px) rotate(10deg); }
    37%   { transform: translate(1px, 1px) rotate(0deg); }
    52%   { transform: translate(1px, -2px) rotate(0deg); }
    70%   { transform: translate(-1px, 0) rotate(0deg); }
    71.5% { transform: translate(-1px, 3px) rotate(22deg); }
    74%   { transform: translate(0, 3px) rotate(22deg); }
    75.5% { transform: translate(0, 0) rotate(0deg); }
    100%  { transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes pinP5 {
    0%    { transform: translate(0, 0) rotate(0deg); }
    14%   { transform: translate(2px, -3px) rotate(0deg); }
    24%   { transform: translate(1px, 0) rotate(0deg); }
    25.5% { transform: translate(1px, 4px) rotate(26deg); }
    28%   { transform: translate(0, 4px) rotate(26deg); }
    29.5% { transform: translate(0, 0) rotate(0deg); }
    33%   { transform: translate(0, 0) rotate(0deg); }
    33.8% { transform: translate(-4px, 12px) rotate(-14deg); }
    37%   { transform: translate(1px, 1px) rotate(0deg); }
    44%   { transform: translate(2px, 2px) rotate(0deg); }
    72%   { transform: translate(-1px, 0) rotate(0deg); }
    73.5% { transform: translate(-1px, 3px) rotate(20deg); }
    76%   { transform: translate(0, 3px) rotate(20deg); }
    77.5% { transform: translate(0, 0) rotate(0deg); }
    100%  { transform: translate(0, 0) rotate(0deg); }
  }
  /* goliath grouper: a resident of the bottom. Patrols from the piling to mid water and back, hovering for long spells */
  .waves .fish-wrap.fw7 { transform-origin: 34px calc(93% - 16px); animation-name: swimGrouper; animation-duration: 180s; animation-delay: -30s; animation-timing-function: ease-in-out; }
  @keyframes swimGrouper {
    0%   { transform: translate(62vw, 0) scaleX(1); }
    20%  { transform: translate(60vw, -3px) scaleX(1); }
    45%  { transform: translate(24vw, 4px) scaleX(1); }
    60%  { transform: translate(22vw, 1px) scaleX(1); }
    63%  { transform: translate(22vw, 1px) scaleX(-1); }
    88%  { transform: translate(60vw, -2px) scaleX(-1); }
    96%  { transform: translate(63vw, 0) scaleX(-1); }
    100% { transform: translate(62vw, 0) scaleX(1); }
  }
  .waves svg.fish.fish7 { width: 72px; bottom: 7%; opacity: .34; animation-duration: 14s; transition: bottom 2.5s ease-in-out; }
  /* outside sit mode the tab bar covers the bottom 90 px (about 38 % of the water). The grouper rises to sit at the glass's top edge, its back showing
     above the bar as a big slow shadow; when the water rises for sit mode it settles back to the sand. The bonnethead stays on the sand and belongs to sit mode */
  body:not(.dock) .waves svg.fish.fish7 { bottom: 33%; }
  .fish7 use { animation-duration: 4s; transform-origin: 40% 50%; }
  /* spanish mackerel: one quick pass each way, a minute apart (turns happen off screen) */
  .waves .fish-wrap.fw8 { transform-origin: 22px calc(72% - 7px); animation-name: swimMack; animation-duration: 120s; animation-delay: -66s; }
  @keyframes swimMack {
    0%    { transform: translate(112vw, 0) scaleX(-1) rotate(0deg); }
    3.5%  { transform: translate(55vw, -10px) scaleX(-1) rotate(-5deg); }
    7%    { transform: translate(-25vw, 4px) scaleX(-1) rotate(4deg); }
    7.5%  { transform: translate(-25vw, 14px) scaleX(1) rotate(0deg); }
    53%   { transform: translate(-25vw, 14px) scaleX(1) rotate(0deg); }
    57.5% { transform: translate(50vw, 2px) scaleX(1) rotate(-5deg); }
    61.5% { transform: translate(112vw, 12px) scaleX(1) rotate(3deg); }
    99.5% { transform: translate(112vw, 12px) scaleX(1) rotate(0deg); }
    100%  { transform: translate(112vw, 0) scaleX(-1) rotate(0deg); }
  }
  .waves svg.fish.fish8 { width: 44px; bottom: 28%; opacity: .22; animation-duration: 4s; }
  .fish8 use { animation-duration: .6s; }
  /* mangrove snappers: a loose group in the shadow of the dock; they hang, shift, one turns now and then, and all bolt when the blacktip passes under them */
  .waves .fish-wrap.fw9 { inset: auto; right: 4%; bottom: 18%; width: 130px; height: 60px; animation-name: snapStartle; animation-duration: 150s; animation-delay: -100s; animation-timing-function: linear; }
  @keyframes snapStartle { 0%, 4% { transform: translate(0, 0); } 4.5% { transform: translate(-34px, -10px); } 10%, 55% { transform: translate(0, 0); } 55.4% { transform: translate(-22px, 4px); } 61%, 100% { transform: translate(0, 0); } }
  .waves svg.fish.snap { opacity: .3; animation: snapHover 14s ease-in-out infinite alternate; }
  .waves svg.fish.snap use { animation-duration: 2s; }
  .snap.s1 { width: 36px; left: 0;    bottom: 30px; animation-delay: -3s; }
  .waves svg.fish.snap.s2 { width: 30px; left: 44px; bottom: 44px; animation: snapTurn 23s ease-in-out infinite; animation-delay: -9s; }
  .snap.s3 { width: 34px; left: 62px; bottom: 12px; animation-delay: -6s; animation-duration: 12s; }
  .snap.s4 { width: 28px; left: 96px; bottom: 34px; animation-delay: -1s; animation-duration: 19s; }
  @keyframes snapHover { 0% { transform: translate(0, 0); } 40% { transform: translate(-6px, 3px); } 70% { transform: translate(-4px, -4px); } 100% { transform: translate(5px, 2px); } }
  @keyframes snapTurn {
    0%   { transform: translate(0, 0) scaleX(1); }
    38%  { transform: translate(-8px, 3px) scaleX(1); }
    42%  { transform: translate(-8px, 3px) scaleX(-1); }
    78%  { transform: translate(7px, -3px) scaleX(-1); }
    82%  { transform: translate(7px, -3px) scaleX(1); }
    100% { transform: translate(0, 0) scaleX(1); }
  }
  /* blacktip: a steady pass on a slow S every two and a half minutes; bonnethead: low over the sand, the other way, every four */
  .waves .fish-wrap.fw10 { transform-origin: 42px calc(74% - 20px); animation-name: swimShark; animation-duration: 150s; animation-delay: -100s; animation-timing-function: linear; }
  @keyframes swimShark {
    0%   { transform: translate(110vw, 0) rotate(0deg); }
    7%   { transform: translate(74vw, -10px) rotate(3deg); }
    14%  { transform: translate(38vw, 8px) rotate(-3deg); }
    21%  { transform: translate(5vw, -6px) rotate(2deg); }
    28%  { transform: translate(-40vw, 0) rotate(0deg); }
    100% { transform: translate(-40vw, 0) rotate(0deg); }
  }
  .waves svg.fish.blacktip { width: 76px; bottom: 26%; opacity: .18; animation-duration: 12s; }
  .blacktip use { transform-origin: 28% 50%; animation-duration: 1.7s; }
  .waves .fish-wrap.fw11 { transform-origin: 37px calc(95% - 15px); animation-name: swimBonnet; animation-duration: 250s; animation-delay: -60s; animation-timing-function: linear; }
  @keyframes swimBonnet {
    0%   { transform: translate(-35vw, 0) rotate(0deg); }
    9%   { transform: translate(15vw, -8px) rotate(-3deg); }
    18%  { transform: translate(65vw, 4px) rotate(2deg); }
    26%  { transform: translate(112vw, 0) rotate(0deg); }
    100% { transform: translate(112vw, 0) rotate(0deg); }
  }
  .waves svg.fish.bonnet { width: 78px; bottom: 5%; opacity: .26; animation-duration: 12s; }
  .bonnet use { transform-origin: 78% 50%; animation-duration: 1.3s; }

  /* light in the water: two soft shafts of surface light drift and breathe across the fish layer, so the fish sit in water rather than on it.
     Gradients only, animated on transform and opacity. Dimmer at dusk, dimmest at night; slower after 21:00 */
  .waves .light { position: absolute; left: -20%; right: -20%; top: 30%; bottom: 0; pointer-events: none; opacity: .5;
    background:
      linear-gradient(104deg, transparent 20%, rgba(255,255,255,.26) 30%, rgba(255,255,255,.08) 37%, transparent 43%),
      linear-gradient(98deg, transparent 54%, rgba(255,255,255,.2) 62%, rgba(255,255,255,.06) 68%, transparent 73%);
    -webkit-mask-image: linear-gradient(rgba(0,0,0,.9), rgba(0,0,0,.35) 60%, transparent); mask-image: linear-gradient(rgba(0,0,0,.9), rgba(0,0,0,.35) 60%, transparent);
    animation: lightDrift 46s ease-in-out infinite alternate, lightBreathe 19s ease-in-out infinite alternate; }
  html[data-sky="evening"]:not(.night) .waves .light { opacity: .4; }
  html.night .waves .light { opacity: .16; }
  body.late .waves .light { animation-duration: 70s, 28s; }
  @keyframes lightDrift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
  @keyframes lightBreathe { from { opacity: .4; } to { opacity: .7; } }
  html.night .waves .light { animation-name: lightDrift, lightBreatheNight; }
  @keyframes lightBreatheNight { from { opacity: .08; } to { opacity: .18; } }

  /* night under the lamp. Real dock behaviour: bait gathers in the lamp's glade and the snook holds just below it, nose to the current, and takes one
     fish a cycle. Same 130 s clock and delays, so the strike and the school's burst still land together at 33 %. The glade is the only light on the
     water at night, so the daytime light shafts go; fish inside the glade are brighter than the rest of the night water */
  html.night .waves .light { display: none; }
  html.night .waves .glade { background: rgba(242,201,138,.13); width: 78px; right: 6%; }
  html.night .waves .fish-wrap.fw2 { animation-name: swimSnookNight; }
  html.night .waves svg.fish.fish2 { opacity: .36; }
  @keyframes swimSnookNight {
    0%    { transform: translate(80vw, 10px) scaleX(1) rotate(0deg); }
    14%   { transform: translate(79vw, 12px) scaleX(1) rotate(0deg); }
    26%   { transform: translate(80vw, 9px) scaleX(1) rotate(0deg); }
    31%   { transform: translate(80vw, 8px) scaleX(1) rotate(2deg); }
    31.6% { transform: translate(78vw, 6px) scaleX(1) rotate(5deg); }
    33.2% { transform: translate(69vw, -2px) scaleX(1) rotate(3deg); }
    36%   { transform: translate(66vw, 1px) scaleX(1) rotate(0deg); }
    43%   { transform: translate(65vw, 4px) scaleX(1) rotate(0deg); }
    45%   { transform: translate(65vw, 5px) scaleX(-1) rotate(0deg); }
    60%   { transform: translate(75vw, 11px) scaleX(-1) rotate(-2deg); }
    74%   { transform: translate(82vw, 10px) scaleX(-1) rotate(0deg); }
    77%   { transform: translate(82vw, 10px) scaleX(1) rotate(0deg); }
    100%  { transform: translate(80vw, 10px) scaleX(1) rotate(0deg); }
  }
  html.night .waves .fish-wrap.fw6 { animation-name: swimSchoolNight; }
  html.night .waves svg.fish.pin { opacity: .34; }
  @keyframes swimSchoolNight {
    0%    { transform: translate(74vw, -10px) scaleX(1); }
    16%   { transform: translate(76vw, -7px) scaleX(1); }
    24%   { transform: translate(75vw, -11px) scaleX(1); }
    33%   { transform: translate(75vw, -10px) scaleX(1); }
    33.8% { transform: translate(63vw, -16px) scaleX(1); }
    37%   { transform: translate(65vw, -12px) scaleX(1); }
    40%   { transform: translate(65vw, -12px) scaleX(-1); }
    52%   { transform: translate(73vw, -10px) scaleX(-1); }
    54%   { transform: translate(73vw, -10px) scaleX(1); }
    78%   { transform: translate(76vw, -8px) scaleX(1); }
    100%  { transform: translate(74vw, -10px) scaleX(1); }
  }

  /* distant boat on the horizon, once an hour, three minutes to cross */
  .waves svg.boat { position: absolute; bottom: 62%; top: auto; left: 0; width: 26px; height: 10px; fill: var(--silhouette); opacity: 0; animation: boatCross 3600s linear infinite; animation-delay: -3480s; }
  @keyframes boatCross { 0% { transform: translateX(-40px); opacity: 0; } 0.3% { opacity: .28; } 4.7% { opacity: .28; } 5% { transform: translateX(105vw); opacity: 0; } 100% { transform: translateX(105vw); opacity: 0; } }

  /* sun glitter on the water, mornings and evenings */
  .waves .glitter { position: absolute; left: 0; right: 0; top: 22%; height: 22%; pointer-events: none; display: none; animation: glitterDrift 18s ease-in-out infinite alternate; }
  html[data-sky="morning"] .glitter, html[data-sky="evening"] .glitter { display: block; }
  @keyframes glitterDrift { from { transform: translateX(-8px); } to { transform: translateX(8px); } }
  .glitter span { position: absolute; width: 3px; height: 2px; border-radius: 2px; background: #FFFFFF; opacity: 0; filter: blur(.2px); animation: glint 4s ease-in-out infinite; }
  html[data-sky="evening"] .glitter span { background: #F6D9A8; }
  html.night .glitter span { animation-name: glintDim; }
  @keyframes glint { 0%, 100% { opacity: 0; } 50% { opacity: .75; } }
  @keyframes glintDim { 0%, 100% { opacity: 0; } 50% { opacity: .3; } }
  .glitter span:nth-child(1) { left: 6%; top: 30%; animation-duration: 3.1s; animation-delay: -1s; }
  .glitter span:nth-child(2) { left: 14%; top: 62%; animation-duration: 4.4s; animation-delay: -2.2s; }
  .glitter span:nth-child(3) { left: 23%; top: 18%; animation-duration: 3.7s; animation-delay: -.5s; }
  .glitter span:nth-child(4) { left: 31%; top: 48%; animation-duration: 5.2s; animation-delay: -3s; }
  .glitter span:nth-child(5) { left: 39%; top: 80%; animation-duration: 3.4s; animation-delay: -1.7s; }
  .glitter span:nth-child(6) { left: 47%; top: 36%; animation-duration: 4.8s; animation-delay: -.9s; }
  .glitter span:nth-child(7) { left: 55%; top: 10%; animation-duration: 3.9s; animation-delay: -2.6s; }
  .glitter span:nth-child(8) { left: 62%; top: 58%; animation-duration: 4.1s; animation-delay: -3.4s; }
  .glitter span:nth-child(9) { left: 70%; top: 26%; animation-duration: 3.3s; animation-delay: -.3s; }
  .glitter span:nth-child(10) { left: 78%; top: 70%; animation-duration: 5.6s; animation-delay: -1.3s; }
  .glitter span:nth-child(11) { left: 86%; top: 42%; animation-duration: 3.6s; animation-delay: -2.9s; }
  .glitter span:nth-child(12) { left: 93%; top: 14%; animation-duration: 4.6s; animation-delay: -.7s; }

  /* ragdoll on the dock: tail hangs over the edge and flicks, one ear twitches now and then */
  .dock .cat .cat-tail { fill: none; stroke: var(--silhouette); stroke-width: 2.8; stroke-linecap: round; transform-origin: 139px 60.5px; animation: catTail 7s ease-in-out infinite alternate; }
  @keyframes catTail { from { transform: rotate(-9deg); } to { transform: rotate(7deg); } }
  .dock .cat .ear-l { transform-origin: 125.5px 46.2px; animation: earTwitch 23s ease-in-out infinite; }
  @keyframes earTwitch { 0%, 91% { transform: rotate(0); } 93% { transform: rotate(-16deg); } 95% { transform: rotate(0); } 100% { transform: rotate(0); } }


  .waves-faint { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; z-index: 0; overflow: hidden; animation: bob 3s ease-in-out infinite alternate; }
  .waves-faint svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; animation: drift 14s linear infinite; }
  .waves-faint path { fill: var(--scene-mid); opacity: 0.5; }

  /* ---------- sky layers ---------- */
  .sky-breathe { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, var(--sky-top), transparent 70%); opacity: 0; animation: breathe 10s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: 0; } to { opacity: 0.30; } }

  .clouds { position: fixed; top: 0; left: 0; right: 0; height: 220px; pointer-events: none; z-index: 0; overflow: hidden; }
  .cloud { position: absolute; top: 30px; background: rgba(255,255,255,0.75); border-radius: 50%; filter: blur(6px); animation: cloudDrift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: rgba(255,255,255,0.75); border-radius: 50%; }
  html.night .cloud, html.night .cloud::before, html.night .cloud::after { background: rgba(255,255,255,0.08); }
  html[data-sky="evening"]:not(.night) .cloud, html[data-sky="evening"]:not(.night) .cloud::before, html[data-sky="evening"]:not(.night) .cloud::after { background: rgba(246,217,193,0.75); }
  
  .cloud.c1 { top: 20px; width: 180px; height: 50px; animation-duration: 90s; animation-delay: -10s; }
  .cloud.c1::before { width: 90px; height: 60px; left: 20px; top: -25px; }
  .cloud.c1::after { width: 70px; height: 46px; left: 100px; top: -14px; }
  .cloud.c2 { top: 90px; width: 120px; height: 36px; animation-duration: 100s; animation-delay: -35s; }
  .cloud.c2::before { width: 60px; height: 40px; left: 15px; top: -18px; }
  .cloud.c2::after { width: 50px; height: 32px; left: 65px; top: -10px; }
  .cloud.c3 { top: 150px; width: 220px; height: 60px; animation-duration: 120s; animation-delay: -60s; }
  .cloud.c3::before { width: 110px; height: 70px; left: 25px; top: -30px; }
  .cloud.c3::after { width: 80px; height: 54px; left: 130px; top: -16px; }
  @keyframes cloudDrift { from { transform: translateX(110vw); } to { transform: translateX(-60vw); } }

  .orb { position: fixed; width: 120px; height: 120px; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(14px); opacity: 0; transition: opacity 2s; animation: orbPulse 40s ease-in-out infinite alternate; }
  html[data-sky="morning"] .orb, html[data-sky="day"] .orb { opacity: 1; top: 18px; right: -20px; background: radial-gradient(circle, rgba(var(--orb-rgb),0.75), transparent 70%); }
  
  html[data-sky="evening"] .orb { opacity: 1; width: 130px; height: 130px; top: auto; bottom: calc(28vh - 70px); left: -30px; background: radial-gradient(circle, rgba(243,185,138,.95), rgba(243,185,138,.5) 55%, transparent 70%); }
  html.night[data-sky="evening"] .orb { width: 120px; height: 120px; top: 22px; left: -30px; background: radial-gradient(circle, rgba(201,174,126,0.5), transparent 70%); }
  html.night:not([data-sky="night"]) .orb { opacity: 1; top: 26px; right: 10px; left: auto; width: 90px; height: 90px; background: radial-gradient(circle, rgba(221,230,234,0.45), transparent 70%); }
  html[data-sky="night"] .orb { opacity: 1; top: 26px; right: 10px; width: 90px; height: 90px; background: radial-gradient(circle, rgba(221,230,234,0.45), transparent 70%); }
  @keyframes orbPulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  div.rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  div.rain span { position: absolute; top: -10vh; width: 2px; height: 18px; border-radius: 2px; background: rgba(var(--accent-rgb),0.25); animation: fall linear infinite; }
  html.night div.rain span { background: rgba(var(--accent-rgb),0.25); }
  @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(105vh); } }
  html.rain .waves .wave-wrap { animation: bobRain 4s ease-in-out infinite alternate; }
  @keyframes bobRain { from { transform: translateY(0); } to { transform: translateY(8px); } }

  .ripple { position: fixed; width: 20px; height: 20px; margin-left: -10px; margin-top: -10px; border-radius: 50%; border: 2px solid rgba(59,107,117,0.5); transform: scale(1); opacity: 0.6; animation: rippleOut 4.5s ease-out forwards; pointer-events: none; z-index: 5; }
  @keyframes rippleOut { to { transform: scale(12); opacity: 0; } }

  /* ---------- cast and reel: line goes out while you write, comes up empty when you save ---------- */
  .dock .rod-wind, .dock .rod-cast { transform-box: fill-box; transform-origin: 100% 28%; }
  .dock .rod-cast { transition: transform 1.2s cubic-bezier(.3,.7,.3,1); }
  body.whip .dock .rod-cast { transform: rotate(8deg); transition: transform .32s ease-in; }
  body.casting .dock .rod-cast { transform: rotate(3deg); transition: transform .7s cubic-bezier(.2,1.4,.4,1); }
  .dock .cast-line { fill: none; stroke: var(--silhouette); stroke-width: .8; stroke-linecap: round; opacity: 0; stroke-dasharray: 70; stroke-dashoffset: 70; transition: stroke-dashoffset 1s ease-in, opacity .4s .6s; }
  body.casting .dock .cast-line { opacity: .58; stroke-dashoffset: 0; transition: stroke-dashoffset .9s cubic-bezier(.3,.8,.4,1) .3s, opacity .2s .3s; }
  .dock .cast-bobber { fill: var(--silhouette); opacity: 0; transition: opacity .4s; }
  body.casting .dock .cast-bobber { opacity: .7; transition: opacity .3s 1.1s; animation: bobberBob 3s ease-in-out infinite alternate; }
  @keyframes bobberBob { from { transform: translateY(-1px); } to { transform: translateY(1.5px); } }
  .dock .cast-splash { fill: none; stroke: var(--silhouette); stroke-width: 1; opacity: 0; transform-box: fill-box; transform-origin: center; }
  body.casting .dock .cast-splash { animation: splashOnce 2.4s ease-out 1.1s 1, ringPulse 9s ease-out 4s infinite; }
  @keyframes splashOnce { 0% { transform: scale(.6); opacity: .45; } 100% { transform: scale(3.4); opacity: 0; } }

  /* ---------- wind: a gust every couple of minutes ---------- */
  .clouds { transition: transform 6s cubic-bezier(.25,.6,.3,1); }
  body.gust .clouds { transform: translateX(-56px); transition-duration: 3.5s; }
  .dock .rod-wind { transition: transform 3s ease-in-out; }
  body.gust .dock .rod-wind { transform: rotate(-2.6deg); transition: transform 1.4s cubic-bezier(.3,.6,.3,1); }
  body.gust .waves .wave-wrap { animation: bobGust 1.4s ease-in-out infinite alternate; }
  @keyframes bobGust { from { transform: translateY(1px); } to { transform: translateY(-8px); } }
  .textview { transition: filter 1.6s ease, opacity 1.6s ease, border-color .25s, box-shadow .25s; }
  body.gust:not(.listening) .textview { filter: blur(.7px); opacity: .82; }
  .wind { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .wind span { position: absolute; left: 0; width: 120px; height: 1px; border-radius: 1px; background: var(--silhouette); opacity: 0; }
  .wind span:nth-child(1) { top: 24%; }
  .wind span:nth-child(2) { top: 31%; }
  .wind span:nth-child(3) { top: 40%; }
  .wind span:nth-child(4) { top: 54%; }
  body.gust .wind span { animation: windStreak 2.2s cubic-bezier(.2,.6,.4,1) 1; }
  body.gust .wind span:nth-child(2) { animation-delay: .35s; }
  body.gust .wind span:nth-child(3) { animation-delay: .7s; }
  body.gust .wind span:nth-child(4) { animation-delay: 1.1s; }
  @keyframes windStreak { 0% { transform: translateX(110vw) scaleX(.4); opacity: 0; } 15% { opacity: .16; } 85% { opacity: .1; } 100% { transform: translateX(-30vw) scaleX(1.4); opacity: 0; } }

  /* ---------- sit on the dock: long press the screen, everything but the water goes away ---------- */
  #tab-today { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #tab-today textarea, #tab-today .entry .text { -webkit-user-select: text; user-select: text; }
  #tab-today > .headrow, #tab-today > .entry-glass, #tab-today > .voice, #tab-today > .moods, #tab-today > .saverow, #tab-today > .daylist, nav { transition: opacity 1.2s ease; }
  body.dock #tab-today > :not(.sky-breathe):not(.clouds):not(.orb):not(.waves):not(.rain):not(.wind):not(.dock-ui), body.dock nav { opacity: 0 !important; pointer-events: none; }
  .waves { transition: transform 2.5s ease-out, height 2.5s ease-in-out; }
  body.dock .waves { height: calc(44vh + var(--tide, 0px)); }
  body.dock .sky-breathe { animation-duration: 16s; }
  .dock-ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; visibility: hidden; transition: opacity 1s, visibility 0s 1s; }
  body.dock .dock-ui { opacity: 1; visibility: visible; transition: opacity 1s, visibility 0s; }
  .dock-hint { position: absolute; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); margin: 0; text-align: center; font-size: 13px; color: var(--muted); opacity: 0; }
  body.dock .dock-hint { animation: hintFade 7s ease 1.5s 1; }
  @keyframes hintFade { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .dock-sound { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 20px; width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--card-a); color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; opacity: .7; }
  body.dock .dock-sound { pointer-events: auto; }
  .dock-sound.on { color: var(--accent); opacity: 1; }
  .dock-sound:not(.on) svg path:nth-child(n+2) { display: none; }
  .dock-sound svg { width: 20px; height: 20px; }

  /* ---------- breathe: a ring that breathes 4 in, 1 hold, 7 out; after ten breaths, one question ---------- */
  .breath { position: absolute; left: 50%; top: 36%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--orb-rgb),.42), rgba(var(--orb-rgb),.14) 58%, transparent 72%); border: 1.5px solid rgba(var(--orb-rgb),.85); box-shadow: 0 0 90px 30px rgba(var(--orb-rgb),.2); transform: scale(.6); opacity: 0; transition: opacity 2s .8s; }
  /* a second, fainter ring trails the first by a beat, so the in-breath reads as expanding rather than resizing */
  .breath::after { content: ""; position: absolute; inset: -1.5px; border-radius: 50%; border: 1px solid rgba(var(--orb-rgb),.45); transform: scale(1); }
  body.dock .breath::after { animation: breathTrail 12s infinite; }
  body.dock.slow .breath::after { animation: breathTrailSlow 15s infinite; }
  @keyframes breathTrail { 0%, 4% { transform: scale(.94); opacity: .5; } 33.33% { transform: scale(1.12); opacity: .25; } 41.67% { transform: scale(1.14); opacity: .2; } 100% { transform: scale(.94); opacity: .5; } }
  @keyframes breathTrailSlow { 0%, 4% { transform: scale(.94); opacity: .5; } 40% { transform: scale(1.12); opacity: .25; } 46.67% { transform: scale(1.14); opacity: .2; } 100% { transform: scale(.94); opacity: .5; } }
  body.dock .breath { opacity: 1; animation: breathCycle 12s infinite; }
  body.dock.slow .breath { animation: breathCycleSlow 15s infinite; }
  /* 4 in, 1 hold, 7 out. The ring doubles in area on the in-breath (.6 → 1.25) and the glow fills with it; the out-breath is the long slow half */
  @keyframes breathCycleSlow { 0% { transform: scale(.6); opacity: .55; animation-timing-function: cubic-bezier(.4,0,.6,1); } 40% { transform: scale(1.25); opacity: 1; animation-timing-function: linear; } 46.67% { transform: scale(1.25); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.6,1); } 100% { transform: scale(.6); opacity: .55; } }
  @keyframes breathCycle { 0% { transform: scale(.6); opacity: .55; animation-timing-function: cubic-bezier(.4,0,.6,1); } 33.33% { transform: scale(1.25); opacity: 1; animation-timing-function: linear; } 41.67% { transform: scale(1.25); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.6,1); } 100% { transform: scale(.6); opacity: .55; } }
  .breath-cue { position: absolute; left: 0; right: 0; top: calc(36% + 136px); margin: 0; text-align: center; font-size: 15px; font-weight: 500; color: var(--muted); opacity: 0; transition: opacity 1.5s 1s; }
  .breath-cue small { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 4px; }
  body.dock .breath-cue { opacity: 1; }
  body.refocus .breath { opacity: .35; }
  body.refocus .breath-cue { opacity: 0; transition: opacity .8s; }
  .refocus { position: absolute; left: 24px; right: 24px; top: 30%; opacity: 0; visibility: hidden; transition: opacity 1.5s, visibility 0s 1.5s; }
  body.refocus .refocus { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 1.5s, visibility 0s; }
  .refocus h2 { margin: 0 0 16px; text-align: center; font: 500 22px/1.3 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink); }
  .refocus input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--card-a); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; outline: none; }
  .refocus input:focus { border-color: var(--accent); }
  .refocus .btn { margin-top: 16px; }
  .refocus p { margin: 12px 0 0; text-align: center; font-size: 13px; color: var(--muted); }


  /* the people (design/v4/figures): one silhouette each, breathing */
  .person { fill: var(--silhouette); stroke: var(--silhouette); stroke-linecap: round; stroke-linejoin: round; }
  .person .breathe-fig { transform-box: fill-box; transform-origin: 50% 100%; animation: figBreath 4.6s ease-in-out infinite alternate; }
  @keyframes figBreath { from { transform: scaleY(1); } to { transform: scaleY(1.018); } }
  .dock .person-wrap, .fence .person-wrap, .palm .person-wrap { opacity: .62; }
  .dock .lamp-glow, .campo .lamp-glow { fill: #F2C98A; opacity: 0; transition: opacity 2s; }
  html.night .dock .lamp-glow, html.night .campo .lamp-glow { opacity: .9; }
  /* ---------- El campo argentino: Elias's place. Same engine, ground instead of water ---------- */
  html[data-place="campo"] .waves:not(.campo) { display: none; }
  .waves.campo { display: none; }
  html[data-place="campo"] .waves.campo { display: block; }
  .campo .campo-wrap { position: absolute; inset: 0; }
  .campo svg.band { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .campo .range { fill: var(--scene-back); opacity: 1; }
  html[data-sky="evening"]:not(.night) .campo .range { fill: color-mix(in srgb, var(--scene-back) 85%, #D39A86); }
  
  .campo .steppe-mid { fill: var(--scene-mid); opacity: 1; }
  .campo .steppe-front { fill: var(--scene-front); opacity: 1; }
  .campo .road { fill: var(--scene-land); opacity: 1; }
  .campo .dash { fill: var(--bg); opacity: .55; }
  /* coirón: the wind moves the grass, a gust leans it */
  .campo svg.tuft { position: absolute; width: 40px; height: 24px; transform-origin: 50% 100%; animation: tuftSway 3.2s ease-in-out infinite alternate; overflow: visible; }
  .campo .tuft path { fill: none; stroke: var(--silhouette); stroke-opacity: .5; stroke-width: 1.2; stroke-linecap: round; }
  .campo .tuft.t1 { left: 5%; bottom: 34%; }
  .campo .tuft.t2 { left: 3%; bottom: 29%; width: 32px; height: 19px; animation-duration: 2.7s; animation-delay: -1.1s; }
  .campo .tuft.t3 { left: 22%; bottom: 31%; width: 44px; height: 26px; animation-duration: 3.6s; animation-delay: -2s; }
  .campo .tuft.t4 { left: 91%; bottom: 35%; width: 28px; height: 17px; animation-duration: 2.9s; animation-delay: -.6s; }
  @keyframes tuftSway { from { transform: skewX(-4deg); } to { transform: skewX(5deg); } }
  body.gust .campo .tuft { animation: tuftLean 4.4s cubic-bezier(.3,.6,.3,1) 1; }
  @keyframes tuftLean { 0% { transform: skewX(0); } 30% { transform: skewX(12deg); } 100% { transform: skewX(0); } }
  /* fence and figure: the rail sits on the front band, the figure has a mate */
  .campo svg.fence { position: absolute; right: 0; left: auto; bottom: 36%; width: 150px; height: 86px; overflow: visible; }
  .campo .fence .fig { fill: var(--silhouette); opacity: .55; }
  .campo .fence .arm { fill: none; stroke: var(--silhouette); stroke-opacity: .55; stroke-linecap: round; }
  /* guanaco on the mid band: stands and stares, now and then walks a little */
  .campo .guanaco-wrap { position: absolute; left: 15%; bottom: 50%; width: 22px; height: 24px; animation: guanacoWalk 360s linear infinite; }
  .campo svg.guanaco { width: 100%; height: auto; overflow: visible; fill: var(--silhouette); opacity: .5; }
  @keyframes guanacoWalk { 0%, 40% { transform: translateX(0) scaleX(1); } 46%, 89.9% { transform: translateX(-36px) scaleX(1); } 90% { transform: translateX(-36px) scaleX(-1); } 96%, 99.9% { transform: translateX(0) scaleX(-1); } 100% { transform: translateX(0) scaleX(1); } }
  /* condor over the range: circles, tilts, nearer and farther; gone after dark */
  .campo .condor-wrap { position: absolute; left: 50%; top: 10%; width: 30px; height: 8px; margin-left: -15px; animation: condorCircle 90s linear infinite; }
  .campo svg.condor { width: 100%; height: auto; overflow: visible; fill: var(--silhouette); opacity: .5; animation: condorTilt 4s ease-in-out infinite alternate; }
  @keyframes condorCircle { 0% { transform: translate(60px, 0) scale(1); } 12.5% { transform: translate(42px, 9px) scale(1.08); } 25% { transform: translate(0, 13px) scale(1.15); } 37.5% { transform: translate(-42px, 9px) scale(1.08); } 50% { transform: translate(-60px, 0) scale(1); } 62.5% { transform: translate(-42px, -9px) scale(.9); } 75% { transform: translate(0, -13px) scale(.8); } 87.5% { transform: translate(42px, -9px) scale(.9); } 100% { transform: translate(60px, 0) scale(1); } }
  @keyframes condorTilt { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  body.late .campo .condor-wrap { display: none; }
  /* distant truck: once an hour it comes down the road from the vanishing point */
  .campo svg.truck { position: absolute; left: 50%; top: 50%; width: 8px; height: 3.2px; margin-left: -4px; transform-origin: 50% 100%; opacity: 0; animation: truckDown 3600s linear infinite; animation-delay: -3560s; }
  .campo .truck path, .campo .truck circle { fill: var(--silhouette); opacity: .5; }
  .campo .truck .lights { fill: var(--orb); opacity: 0; }
  body.late .campo .truck .lights { opacity: .9; }
  @keyframes truckDown { 0% { transform: translate(0, 0) scale(.15); opacity: 0; } 0.05% { opacity: .6; } 1.1% { transform: translate(-60px, 60px) scale(1.4); opacity: .6; } 1.15%, 100% { transform: translate(-60px, 60px) scale(1.4); opacity: 0; } }
  /* the faint band on the other tabs follows the place */
  .waves-faint path.steppe { display: none; fill: var(--scene-mid); }
  html[data-place="campo"] .waves-faint path.steppe { display: block; }
  html[data-place="campo"] .waves-faint path:not(.steppe) { display: none; }
  html[data-place="campo"] .waves-faint, html[data-place="campo"] .waves-faint svg { animation: none; width: 100%; }

  /* ---------- Key West: Nick's place. The same water, a beach instead of a dock ---------- */
  html[data-place="keywest"] .waves:not(.keywest) { display: none; }
  .waves.keywest { display: none; overflow-x: clip; overflow-y: visible; }
  .waves.keywest .wave-wrap { overflow: hidden; }
  html[data-place="keywest"] .waves.keywest { display: block; }
  /* a distant key on the horizon, a sailboat now and then behind the back wave */
  .keywest svg.key { position: absolute; left: 8%; bottom: 62%; width: 120px; height: 24px; }
  .keywest .key path { fill: var(--silhouette); opacity: .18; }
  .keywest svg.sail { position: absolute; bottom: 62%; top: auto; left: 0; width: 22px; height: 22px; opacity: 0; animation: sailCross 2400s linear infinite; animation-delay: -2300s; }
  .keywest .sail path { fill: var(--silhouette); opacity: .28; }
  .keywest .sail .mast { fill: none; stroke: var(--silhouette); stroke-opacity: .28; stroke-width: .9; }
  @keyframes sailCross { 0% { transform: translateX(-40px); opacity: 0; } 0.3% { opacity: 1; } 9.7% { opacity: 1; } 10% { transform: translateX(110vw); opacity: 0; } 100% { transform: translateX(110vw); opacity: 0; } }
  /* frigatebird high over the water, gone after dark */
  .keywest .frigate-wrap { position: absolute; left: 30%; top: 3%; width: 16px; height: 28px; margin-left: -8px; animation: frigateLoop 110s linear infinite; }
  .keywest svg.frigate { width: 100%; height: auto; overflow: visible; fill: var(--silhouette); opacity: .5; animation: frigateTilt 6s ease-in-out infinite alternate; }
  @keyframes frigateLoop { 0% { transform: translate(90px, 0) scale(1); } 25% { transform: translate(0, 16px) scale(1.12); } 50% { transform: translate(-90px, 0) scale(1); } 75% { transform: translate(0, -10px) scale(.86); } 100% { transform: translate(90px, 0) scale(1); } }
  @keyframes frigateTilt { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  body.late .keywest .frigate-wrap { display: none; }
  /* sea turtle surfaces between the mid and front wave */
  .keywest .turtle-wrap { position: absolute; left: 30%; bottom: 36%; width: 24px; height: 22px; animation: turtleMove 260s linear infinite; }
  .keywest svg.turtle { width: 100%; height: auto; overflow: visible; fill: var(--accent); opacity: .3; animation: turtleSurface 100s ease-in-out infinite; }
  @keyframes turtleSurface { 0%, 40% { transform: translateY(14px); opacity: 0; } 42% { opacity: 1; } 44%, 48% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(14px); opacity: 0; } 100% { transform: translateY(14px); opacity: 0; } }
  @keyframes turtleMove { from { transform: translateX(0); } to { transform: translateX(120px); } }
  /* the beach in front of the front wave; land does not bob with the water */
  .keywest svg.sand { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .keywest .sand .beach { fill: var(--scene-land); }
  .keywest .sand .wet { fill: #FFFFFF; opacity: .35; }
  html.night .keywest .sand .wet { opacity: .08; }
  /* the palm leans out over the water, the figure sits against it with knees up */
  .keywest svg.palm { position: absolute; right: 0; left: auto; bottom: calc(39% - 10px); width: 210px; height: 160px; overflow: visible; }
  .keywest .palm .fig { fill: var(--silhouette); opacity: .55; }
  .keywest .palm .arm { fill: none; stroke: var(--silhouette); stroke-opacity: .55; stroke-width: 4.6; stroke-linecap: round; }
  .keywest .palm .crown { transform-origin: 106px 32px; animation: crownSway 4s ease-in-out infinite alternate; }
  .keywest .palm .crown path:nth-child(odd) { transform-origin: 106px 32px; animation: frondSway 3.4s ease-in-out infinite alternate; }
  .keywest .palm .crown path:nth-child(even) { transform-origin: 106px 32px; animation: frondSway 4.6s ease-in-out -2s infinite alternate; }
  @keyframes crownSway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  @keyframes frondSway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.6deg); } }
  body.gust .keywest .palm .crown { animation: crownLean 4.4s cubic-bezier(.3,.6,.3,1) 1; }
  @keyframes crownLean { 0% { transform: rotate(0); } 30% { transform: rotate(-5deg); } 100% { transform: rotate(0); } }
  /* a Key West rooster walks the sand, stops, pecks twice, walks back */
  .keywest .rooster-wrap { position: absolute; left: 20%; bottom: 29.5%; width: 16px; height: 18px; animation: roosterWalk 120s linear infinite; }
  .keywest svg.rooster { width: 100%; height: auto; overflow: visible; fill: var(--silhouette); opacity: .5; }
  .keywest .rooster use { transform-box: fill-box; transform-origin: 45% 100%; animation: peck 120s ease-in-out infinite; }
  @keyframes roosterWalk { 0% { transform: translateX(0) scaleX(1); } 10%, 20% { transform: translateX(40px) scaleX(1); } 20.1% { transform: translateX(40px) scaleX(-1); } 30% { transform: translateX(0) scaleX(-1); } 30.1%, 100% { transform: translateX(0) scaleX(1); } }
  @keyframes peck { 0%, 11% { transform: rotate(0); } 12% { transform: rotate(14deg); } 13% { transform: rotate(0); } 15% { transform: rotate(14deg); } 16%, 100% { transform: rotate(0); } }


  /* ---------- v4 ambience: the fast things are tiny, the big things are rare ---------- */
  .amb { position: absolute; pointer-events: none; overflow: visible; }
  .amb, .amb path, .amb circle, .amb ellipse, .amb rect { fill: var(--silhouette); }
  .amb use, .amb svg { transform-box: fill-box; }
  .night-only, .dusk-night, .dusk-only, .day-only { display: none; }
  html[data-sky="evening"]:not(.night) .dusk-only { display: block; }
  html.night .night-only, html.night .dusk-night, html[data-sky="evening"] .dusk-night { display: block; }
  html:not(.night) .day-only { display: block; }
